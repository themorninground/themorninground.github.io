<title>The Morning Round</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,800;1,6..96,500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: The Morning Round's own identity (MR seal, Bodoni wordmark, navy × beige, six accents) spread across a desk-wide newsroom: black strip, sticky bar with menu and settings, ticker, five tabs. Wide screens get three columns; phones get one. */
:root{
  --paper:#F2EADC; --paper-2:#E8DECC; --ink:#14233D; --ink-2:#4A5874; --hair:#D9CDB8; --rule:#14233D;
  --bar:#0B1424; --bar-ink:#F2EADC; --art-bg:#14233D; --art-fg:#EDE3D1; --pop:#6FA8FF;
  --soft:#E5DBC8; --miss:#8E2F2F;
  --head:'Archivo',system-ui,sans-serif; --display:'Bodoni Moda',Didot,Georgia,serif; --ar:'IBM Plex Sans Arabic','Geeza Pro',sans-serif;
  --fs:16px; --sp:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1726;--paper-2:#16233A;--ink:#EDE3D1;--ink-2:#B9AF9C;--hair:#26344D;--rule:#EDE3D1;--bar:#070D18;--bar-ink:#EDE3D1;--art-bg:#1B2C4D;--art-fg:#EDE3D1;--pop:#8DBBFF;--soft:#1B2840;--miss:#E5A09A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1726;--paper-2:#16233A;--ink:#EDE3D1;--ink-2:#B9AF9C;--hair:#26344D;--rule:#EDE3D1;--bar:#070D18;--bar-ink:#EDE3D1;--art-bg:#1B2C4D;--art-fg:#EDE3D1;--pop:#8DBBFF;--soft:#1B2840;--miss:#E5A09A;color-scheme:dark}
:root[data-accent="ink"]{--ink:#141414;--ink-2:#5A544A;--rule:#141414;--bar:#0A0A0A;--art-bg:#141414;--pop:#FF5A3C}
:root[data-accent="claret"]{--ink:#5E1A24;--ink-2:#7A5058;--rule:#5E1A24;--bar:#2A0B10;--art-bg:#5E1A24;--pop:#FF8FA3}
:root[data-accent="brown"]{--ink:#3B2414;--ink-2:#6E5848;--rule:#3B2414;--bar:#1E120A;--art-bg:#3B2414;--pop:#F0B36B}
:root[data-accent="olive"]{--ink:#2F3517;--ink-2:#5B5F45;--rule:#2F3517;--bar:#151809;--art-bg:#2F3517;--pop:#C6D86B}
:root[data-accent="rose"]{--ink:#A93E64;--ink-2:#7E5A64;--rule:#A93E64;--bar:#4A1A2C;--art-bg:#A93E64;--pop:#FFE0EA;--soft:#F1DCD9}
@media (prefers-color-scheme: dark){
  :root[data-accent="ink"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#111111;--paper-2:#1D1B18;--hair:#2E2B26;--bar:#000;--art-bg:#26231F;--pop:#FF6B4F;--soft:#26231F}
  :root[data-accent="claret"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1E0D11;--paper-2:#2B1519;--hair:#3D2228;--bar:#12070A;--art-bg:#3A1A21;--pop:#FF9EB0;--soft:#2B1519}
  :root[data-accent="brown"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1A120C;--paper-2:#261B13;--hair:#3A2C21;--bar:#0F0A06;--art-bg:#352517;--pop:#F2BD7E;--soft:#261B13}
  :root[data-accent="olive"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#12150B;--paper-2:#1C2013;--hair:#2E3322;--bar:#0A0C06;--art-bg:#2A301A;--pop:#D2E27E;--soft:#1C2013}
  :root[data-accent="rose"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#2A1820;--paper-2:#38212B;--hair:#4A2E3A;--bar:#1A0E14;--art-bg:#4A2433;--pop:#FFB8CC;--soft:#38212B}}
:root[data-theme="dark"][data-accent="ink"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#111111;--paper-2:#1D1B18;--hair:#2E2B26;--bar:#000;--art-bg:#26231F;--pop:#FF6B4F;--soft:#26231F}
:root[data-theme="dark"][data-accent="claret"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1E0D11;--paper-2:#2B1519;--hair:#3D2228;--bar:#12070A;--art-bg:#3A1A21;--pop:#FF9EB0;--soft:#2B1519}
:root[data-theme="dark"][data-accent="brown"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1A120C;--paper-2:#261B13;--hair:#3A2C21;--bar:#0F0A06;--art-bg:#352517;--pop:#F2BD7E;--soft:#261B13}
:root[data-theme="dark"][data-accent="olive"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#12150B;--paper-2:#1C2013;--hair:#2E3322;--bar:#0A0C06;--art-bg:#2A301A;--pop:#D2E27E;--soft:#1C2013}
:root[data-theme="dark"][data-accent="rose"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#2A1820;--paper-2:#38212B;--hair:#4A2E3A;--bar:#1A0E14;--art-bg:#4A2433;--pop:#FFB8CC;--soft:#38212B}

:root{--sheet:color-mix(in srgb,var(--paper) 55%,#fff);--lens:#8A5A12;--lens-bg:#F4E6CC;--up:#1E7A46;--down:#B23B2E;--new:#D9512C;--r:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sheet:color-mix(in srgb,var(--paper-2) 70%,var(--paper));--lens:#F1C886;--lens-bg:#2A2214;--up:#6FD39A;--down:#FF8E80;--new:#FF8455}}
:root[data-theme="dark"]{--sheet:color-mix(in srgb,var(--paper-2) 70%,var(--paper));--lens:#F1C886;--lens-bg:#2A2214;--up:#6FD39A;--down:#FF8E80;--new:#FF8455}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--head);font-size:var(--fs);line-height:1.55;padding-block:0;padding-inline:0}
html[lang="ar"] body{font-family:var(--ar)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}}
.tnum{font-variant-numeric:tabular-nums}
.en{font-family:var(--head);direction:ltr;unicode-bidi:isolate;text-align:left}
.arx{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;text-align:right}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
html[lang="ar"] .lbl{letter-spacing:0;font-size:.82rem}
.hl{font-family:var(--head);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
html[lang="ar"] .hl{font-family:var(--ar);font-weight:700;letter-spacing:0}
.muted{color:var(--ink-2)}

/* strip + bar */
.strip{background:var(--bar);color:var(--bar-ink);font-size:.76rem;border-bottom:1px solid rgba(255,255,255,.07)}
.strip .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:32px;direction:ltr}
.strip .r{display:flex;gap:14px;align-items:center}
.strip i{font-family:var(--display)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.bar{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:60px}
.bar .side{display:flex;align-items:center;gap:6px;min-width:0}
.bar .side.end{justify-content:flex-end}
.iconbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--bar-ink);border-radius:8px;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--bar-ink);padding:0;direction:ltr;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand .wm{font-family:var(--display);font-weight:800;font-size:1.35rem;white-space:nowrap}
.langs{display:inline-flex;border:1px solid rgba(242,234,220,.3);border-radius:999px;overflow:hidden;flex:none}
.langs button{background:none;border:0;color:var(--bar-ink);padding:5px 11px;font-size:.8rem;min-height:34px}
.langs button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.searchbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(242,234,220,.3);background:none;color:var(--bar-ink);border-radius:999px;padding:5px 12px;font-size:.8rem;min-height:34px}
.searchbtn kbd{font-family:var(--head);font-size:.7rem;opacity:.7;border:1px solid rgba(242,234,220,.3);border-radius:4px;padding:0 4px}
.tabs{border-top:1px solid rgba(255,255,255,.08)}
.tabs .wrap{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:rgba(242,234,220,.68);padding:11px 0 9px;font-weight:600;font-size:.95rem;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--bar-ink)}
.tab[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--pop)}
@media (max-width:860px){.bar .top{grid-template-columns:auto 1fr auto;min-height:54px}.brand .wm{font-size:1.1rem}.brand svg{width:28px;height:28px}.searchbtn .t,.searchbtn kbd{display:none}.searchbtn{padding:0;width:38px;justify-content:center}.tabs .wrap{justify-content:flex-start;gap:20px}}
@media (max-width:480px){.searchbtn{display:none!important}.brand .wm{font-size:1rem}.brand svg{width:26px;height:26px}.langs button{padding:5px 8px}.bar .top{gap:6px}}

/* settings sheet */
.sheetp{background:var(--paper-2);border-bottom:1px solid var(--hair)}
.sheetp .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding-block:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--hair);background:var(--paper);font-size:.84rem;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.5)}

/* menu */
.menuov{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto}
.menuov .wrap{padding-block:18px 40px}
.menuov .mh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:18px}
.menuov .mh .brand{color:var(--ink)}
.menuov .close{width:44px;height:44px;border:1px solid var(--hair);background:none;border-radius:50%;font-size:1.3rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
.mgrid h4{margin:0 0 8px;border-top:3px solid var(--ink);padding-top:8px}
.mgrid button{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--hair);padding:10px 0;text-align:start;font-weight:600}
.mgrid button small{display:block;font-weight:400;color:var(--ink-2);font-size:.8rem}
.mgrid button:hover{color:var(--pop)}

/* ticker */
.ticker{background:var(--paper-2);border-bottom:1px solid var(--hair);overflow:hidden;direction:ltr}
.track{display:flex;gap:10px;padding:10px 0;width:max-content;animation:tick 60s linear infinite}
.ticker:hover .track,.ticker:focus-within .track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
.tcard{background:var(--bar);color:var(--bar-ink);border-radius:6px;padding:7px 12px;min-width:150px;display:flex;flex-direction:column;gap:1px;text-decoration:none}
.tcard .l{font-size:.74rem;font-weight:600;opacity:.85;white-space:nowrap}
.tcard .v{font-size:.98rem;font-weight:700;white-space:nowrap}
.dir-up{color:#5FD39A}.dir-down{color:#FF7B70}.dir-flat{opacity:.75}
.tsrc{font-size:.72rem;color:var(--ink-2);padding-block:5px;text-align:end;direction:ltr}

/* masthead on front */
.mast{text-align:center;padding-top:calc(20px*var(--sp));direction:ltr}
.mast .the{font-family:var(--display);font-style:italic;font-size:1.05rem}
.mast h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,64px);letter-spacing:.06em;line-height:1}
.mast .tag{display:flex;align-items:center;gap:12px;margin-top:8px}
.mast .tag span{flex:1;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);height:3px;opacity:.5}
.mast .tag i{font-family:var(--display);font-size:.98rem}
.mast .dl{font-size:.78rem;color:var(--ink-2);margin-top:8px;display:flex;justify-content:space-between;border-bottom:3px double var(--rule);padding-bottom:8px;gap:10px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:3px double var(--rule);padding-block:22px 10px;margin-bottom:16px}
.secthead h1{margin:0;font-family:var(--display);font-size:clamp(28px,4vw,46px);font-weight:800}
html[lang="ar"] .secthead h1{font-family:var(--ar);font-weight:700}
.secthead p{margin:0;color:var(--ink-2);font-size:.9rem;max-width:520px}

/* tools / filters */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px;border-bottom:1px solid var(--hair);margin-bottom:22px}
.fsel{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:.86rem;min-height:38px}
.fbtn:hover{border-color:var(--ink-2)}
.fbtn[data-on="1"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fbtn .k{opacity:.65;font-size:.82em}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:25;background:var(--sheet);border:1px solid var(--hair);border-radius:10px;padding:6px;min-width:220px;box-shadow:0 16px 40px rgba(0,0,0,.16);max-height:340px;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:8px 10px;border-radius:6px;text-align:start;font-size:.9rem}
.menu button:hover,.menu button[aria-pressed="true"]{background:var(--soft)}
.menu .n{color:var(--ink-2);font-size:.78em}
.invq{border:1px solid var(--hair);background:var(--sheet);border-radius:999px;padding:6px 13px;min-height:38px;font-size:.86rem;width:190px;max-width:100%}
.layoutseg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;margin-inline-start:auto;background:var(--sheet)}
.layoutseg button{border:0;background:none;padding:6px 12px;font-size:.82rem;min-height:36px;color:var(--ink-2)}
.layoutseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.followf{border:1px solid var(--pop);color:var(--ink);background:none;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;min-height:38px}
.followf[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:.8rem;color:var(--ink-2)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px;font-weight:inherit;text-align:inherit}
.linkish:hover{text-decoration-color:currentColor}

/* front grid */
.front{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:32px;align-items:start}
.colhead{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--rule);padding-top:8px;margin-bottom:10px}
.colhead h3{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] .colhead h3{letter-spacing:0;font-size:.92rem}
.colhead span{font-size:.75rem;color:var(--ink-2)}
.wire{position:sticky;top:130px}
.wire ol{list-style:none;margin:0;padding:0}
.wire li{border-bottom:1px solid var(--hair)}
.wire button{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;width:100%;background:none;border:0;padding:10px 0;text-align:start}
.wire .tm{font-size:.74rem;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums;font-weight:600}
.wire .tt{font-size:.9rem;line-height:1.38;font-weight:600}
.wire button:hover .tt{text-decoration:underline}
.wire .sm{display:block;font-size:.72rem;color:var(--ink-2);margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new);margin-inline-end:6px;vertical-align:middle}
.newtag{font-size:.66rem;font-weight:800;color:var(--new);letter-spacing:.06em}
.lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;color:inherit;padding-bottom:22px;border-bottom:1px solid var(--hair);margin-bottom:22px;background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.lead .pic{aspect-ratio:4/3}
.lead h2{font-size:clamp(1.45rem,2.2vw,2.05rem);line-height:1.2;margin:8px 0 10px}
html[lang="ar"] .lead h2{line-height:1.5;font-size:clamp(1.35rem,1.9vw,1.8rem)}
.lead p{margin:0;color:var(--ink-2)}
.lead:hover h2,.card:hover h3,.rowi:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 22px}
.card{display:block;background:none;border:0;padding:0;text-align:start;width:100%}
.card .pic{aspect-ratio:16/9;margin-bottom:10px}
.card h3{font-size:1.1rem;line-height:1.3;margin:6px 0 6px}
html[lang="ar"] .card h3{line-height:1.55;font-size:1.04rem}
.card p{margin:0 0 6px;color:var(--ink-2);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-2)}
.mono{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:.58rem;font-weight:800;font-family:var(--head);flex:none}
.chip{display:inline-block;border:1px solid var(--hair);border-radius:999px;padding:0 8px;font-size:.72rem;color:var(--ink-2);line-height:1.75;background:var(--sheet)}
.chip.amt{border-color:var(--ink);color:var(--ink);font-weight:800;font-family:var(--head)}
.chip.lensc{border-color:var(--lens);color:var(--lens)}
.chip.done{border-color:var(--up);color:var(--up)}
.pic{position:relative;width:100%;border-radius:4px;overflow:hidden;background:var(--art-bg)}
.pic img,.pic svg{display:block;width:100%;height:100%;object-fit:cover}
.pic img.contain{object-fit:contain;background:#fff;padding:6%}
.cred{position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(6,12,22,.72);color:#F2EADC;font-size:.68rem;padding:2px 7px;border-radius:4px}
.more{margin-top:28px}
.rowi{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;padding:14px 0;border-top:1px solid var(--hair);background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.rowi .pic{aspect-ratio:4/3}
.rowi h3{font-size:1.02rem;line-height:1.38;margin:4px 0 6px}
.rail .block{margin-bottom:28px}
.rank{list-style:none;margin:0;padding:0}
.rank li button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:9px 0;border-bottom:1px solid var(--hair);text-align:start}
.rank .i{font-size:.75rem;color:var(--ink-2);font-weight:700}
.rank .nm{font-weight:700;font-size:.9rem;display:block}
.rank .barx{display:block;height:5px;border-radius:2px;background:var(--pop);margin-top:5px;transform-origin:left}
html[dir="rtl"] .rank .barx{transform-origin:right}
@media (prefers-reduced-motion:no-preference){.rank .barx{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}}
@keyframes grow{from{transform:scaleX(0)}}
.rank .a{font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.lensli{display:block;width:100%;text-align:start;background:var(--lens-bg);border:0;border-inline-start:3px solid var(--lens);padding:10px 12px;margin-bottom:8px;border-radius:0}
.lensli b{display:block;font-size:.88rem}
.lensli span{font-size:.82rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--sheet);border-radius:999px;padding:4px 10px 4px 5px;font-size:.8rem}
html[dir="rtl"] .srcs button{padding:4px 5px 4px 10px}

const FINE=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
let peekT=null;

function showPeek(el){
  const n=S.items.find(x=>x.id===el.dataset.open);if(!n||S.view.story)return;const p=$('#peek');
  const kv=[[t().amount,n.type==='deal'?amt(n):null],[t().stage,n.stage?stageL(n.stage):null],[t().investors,(n.investors||[]).slice(0,3).map(i=>i.name).join(', ')],[t().marketK,n.market?mktL(n.market):null]].filter(x=>x[1]);
  p.innerHTML=`${pic(n,680,340,false)}<div class="in">${metaLine(n)}<h4 class="hl">${esc(C(n,'title'))}</h4><div class="kv2">${kv.map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>${n.lens?`<div class="lz">${esc((n.lens[L]||n.lens.en).slice(0,150))}…</div>`:''}</div>`;
  const r=el.getBoundingClientRect();const pw=340;const vw=document.documentElement.clientWidth;
  let x=r.right+14;if(x+pw>vw-12)x=r.left-pw-14;if(x<12)x=Math.min(vw-pw-12,r.left);

function allTerms(){const m=new Map();S.items.forEach(n=>(n.terms||[]).forEach(g=>{if(!m.has(g.t.toLowerCase()))m.set(g.t.toLowerCase(),{t:g.t,ar:g.ar,def:g.def,from:n.id})}));(me().terms||[]).forEach(g=>{if(!m.has(String(g.t).toLowerCase()))m.set(String(g.t).toLowerCase(),g)});return [...m.values()].sort((a,b)=>a.t.localeCompare(b.t))}
function index(){
  const out=[];const seen=new Set();const add=(k,label,act,sub)=>{const key=k+'|'+label;if(!label||seen.has(key))return;seen.add(key);out.push({k,label,act,sub})};
  sorted().forEach(n=>{add('story',C(n,'title'),{story:n.id},typeL(n)+' · '+srcName(n));if(n.company)add('company',n.company,{ent:{k:'company',v:n.company}});(n.investors||[]).forEach(i=>add('investor',i.name,{ent:{k:'investor',v:i.name}}));add('source',srcName(n),{ent:{k:'source',v:srcName(n)}})});
  Object.values(S.profiles||{}).forEach(p=>add(p.kind,p.name,{ent:{k:p.kind,v:p.name}},p.kind==='company'?indL(p.industry||''):(p.type&&(p.type[L]||p.type.en))));
  (S.concepts||[]).forEach(c=>add('concept',c.name[L]||c.name.en,{tab:'foryou',concept:c.id},c.short[L]||c.short.en));
  allTerms().forEach(g=>add('term',g.t+(g.ar?' · '+g.ar:''),g.from?{story:g.from}:{tab:'foryou'},g.def));
  return out;
}
function openCmd(){
  if($('.cmdk'))return;hidePeek();const all=index();let sel=0;let res=all.slice(0,12);
  const o=document.createElement('div');o.className='cmdk';o.innerHTML=`<div class="box" role="dialog" aria-label="${esc(t().search)}"><input id="cq" placeholder="${esc(t().searchPh)}" autocomplete="off"><ul id="cr" role="listbox"></ul><div class="hint">${esc(t().searchHint)}</div></div>`;
  document.body.appendChild(o);const q=o.querySelector('#cq'),ul=o.querySelector('#cr');
  const kl=k=>t().ent[k]||k;
  const draw=()=>{ul.innerHTML=res.map((r,i)=>`<li><button role="option" data-i="${i}" aria-selected="${i===sel}"><span class="k">${esc(kl(r.k))}</span><span style="min-width:0"><b style="font-weight:700">${esc(r.label)}</b>${r.sub?`<span class="meta" style="display:block">${esc(String(r.sub).slice(0,110))}</span>`:''}</span></button></li>`).join('')||`<li class="empty" style="padding:20px">—</li>`;ul.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(+b.dataset.i))};
  const close=()=>o.remove();
  const pick=i=>{const r=res[i];if(!r)return;close();go(Object.assign({tab:'news'},r.act),!!r.act.tab&&!r.act.concept)};
  q.oninput=()=>{const s=q.value.trim().toLowerCase();res=(s?all.filter(r=>(r.label+' '+(r.sub||'')).toLowerCase().includes(s)):all).slice(0,14);sel=0;draw()};
  q.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(res.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter')pick(sel);else if(e.key==='Escape')close()};
  o.onclick=e=>{if(e.target===o)close()};draw();q.focus();
}
$('#cmdBtn').onclick=openCmd;
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'');if((e.key==='/'&&!/INPUT|TEXTAREA/.test(tag))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openCmd()}});

/* scrubber: daily strip with a brush */
function drawScrub(root){const el=root.querySelector('#c-scrub');const W=el.clientWidth||900,H=64,m={l:6,r:6,t:6,b:18};const svg=svgIn(el,W,H);const all=allDeals().filter(x=>FUND_KINDS.includes(x.kind));
  const p=d3.timeParse('%Y-%m-%d'),f=d3.timeFormat('%Y-%m-%d');const x=d3.scaleTime([p(S.deals.from),p(S.deals.to)],[m.l,W-m.r]);const days=d3.timeDays(p(S.deals.from),d3.timeDay.offset(p(S.deals.to),1));
  const byDay=d3.rollup(all,v=>d3.sum(v,y=>y.amount||.3),y=>y.date);const y=d3.scaleSqrt([0,d3.max(byDay.values())||1],[H-m.b,m.t]);
  svg.append('g').selectAll('rect').data(days).join('rect').attr('x',dd=>x(dd)).attr('width',Math.max(1,(W-m.l-m.r)/days.length-1)).attr('y',dd=>y(byDay.get(f(dd))||0)).attr('height',dd=>H-m.b-y(byDay.get(f(dd))||0)).attr('fill',popc()).attr('opacity',.8);
  svg.append('g').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(d3.timeMonth.every(1)).tickFormat(dd=>dd.toLocaleDateString(loc(),{month:'short'}))).call(g=>{g.select('.domain').attr('stroke',hairc());g.selectAll('text').attr('fill',ink2()).attr('font-size',10);g.selectAll('line').attr('stroke',hairc())});
  const br=d3.brushX().extent([[m.l,m.t],[W-m.r,H-m.b]]).on('end',ev=>{if(!ev.sourceEvent)return;if(!ev.selection){S.ds.r0=S.ds.r1=null;soon();return}const [a,b]=ev.selection.map(x.invert);S.ds.r0=f(d3.timeDay.floor(a));S.ds.r1=f(d3.timeDay.ceil(b));soon()});
  const g=svg.append('g').attr('class','brush').call(br);if(S.ds.r0)g.call(br.move,[x(p(S.ds.r0)),x(p(S.ds.r1))]);}

function drawMap(root){const el=root.querySelector('#c-map');const W=el.clientWidth||900,H=Math.max(260,Math.min(440,W*.5));const svg=svgIn(el,W,H);const fd=fDeals({noMarket:true});

  const geo=window.MR_GEO&&typeof topojson!=='undefined'?topojson.feature(window.MR_GEO,window.MR_GEO.objects.countries):null;
  const proj=d3.geoMercator();if(geo){proj.fitExtent([[6,6],[W-6,H-6]],{type:'Feature',geometry:{type:'MultiPoint',coordinates:[[-15,13],[61,13],[-15,38],[61,38]]}})}else proj.fitExtent([[6,6],[W-6,H-6]],{type:'Feature',geometry:{type:'MultiPoint',coordinates:[[-15,13],[61,13],[-15,38],[61,38]]}});

    .on('mousemove',(ev,f)=>{const iso=NUM2ISO[String(f.id).padStart(3,'0')];const b=iso&&by.get(iso);if(!b)return;gtip(ev,`<b>${esc(MKT_FULL(iso))}</b><br>${esc(money(b.v))} · ${esc(dt().deals(b.n))}`)}).on('mouseleave',gtipOff).on('click',(ev,f)=>{const iso=NUM2ISO[String(f.id).padStart(3,'0')];if(by.get(iso)){S.ds.market=S.ds.market===iso?null:iso;soon()}})}
  else gz.append('text').attr('x',W/2).attr('y',H-8).attr('text-anchor','middle').attr('font-size',10).attr('fill',ink2()).text('—');
  // arcs: investor HQ city -> deal country
  const arcs=[];fd.forEach(x=>(x.investors||[]).forEach(i=>{const p=profFor(i.name);if(!p||!p.hq)return;const city=Object.keys(CITY).find(c=>p.hq.includes(c));if(!city||!CENT[x.market])return;arcs.push({from:CITY[city],to:CENT[x.market],inv:i.name,x})}));
  gz.append('g').attr('fill','none').selectAll('path').data(arcs).join('path').attr('d',a=>{const [x1,y1]=proj(a.from),[x2,y2]=proj(a.to);const dx=x2-x1,dy=y2-y1,dr=Math.hypot(dx,dy)*1.2;return `M${x1},${y1}A${dr},${dr} 0 0,1 ${x2},${y2}`}).attr('stroke',popc()).attr('stroke-width',1.2).attr('opacity',.45).attr('class','arc').attr('data-k',a=>keysOf(a.x)+'|inv:'+a.inv).attr('stroke-dasharray','3 3');

  bub.append('circle').attr('r',0).attr('fill',popc()).attr('fill-opacity',.55).attr('stroke',([k])=>S.ds.market===k?ink():popc()).attr('stroke-width',([k])=>S.ds.market===k?3:1.5).transition().duration(700).attr('r',([,b])=>r(b.v));

  bub.on('mousemove',(ev,[k,b])=>{gtip(ev,`<b>${esc(MKT_FULL(k))}</b><br>${esc(money(b.v))} · ${esc(dt().deals(b.n))}${b.top?`<br>${L==='ar'?'أكبر صفقة':'Largest'}: ${esc(b.top.company)} ${esc(b.top.amount?money(b.top.amount):'')}`:''}`);linkOn('mk',k)}).on('mouseleave',()=>{gtipOff();linkOff()}).on('click',(ev,[k])=>{S.ds.market=S.ds.market===k?null:k;soon()});

function drawRace(root){const el=root.querySelector('#c-race');const W=el.clientWidth||460,H=300,m={l:46,r:60,t:26,b:6};const svg=svgIn(el,W,H);const ms=S.series.months||[];

    all.transition().duration(dur).attr('transform',(r,j)=>`translate(0,${m.t+j*bh})`);all.select('rect').attr('fill',r=>r.k==='KSA'?popc():r.k==='UAE'?'#E2A04A':r.k==='EGY'?'#5FD39A':ink2()).transition().duration(dur).attr('width',r=>Math.max(2,x(r.v)-m.l));all.select('.n').attr('fill',ink()).attr('dy',4).text(r=>r.k);all.select('.v').attr('fill',ink()).attr('dy',4).transition().duration(dur).attr('x',r=>x(r.v)+6).tween('text',function(r){const i0=d3.interpolate(+(this.dataset.v||0),r.v);this.dataset.v=r.v;return t2=>{this.textContent=money(i0(t2))}});
    b.exit().transition().duration(dur).attr('transform',`translate(0,${H})`).remove()};

  if(S.ds.story===1&&!root._raced){root._raced=1;setTimeout(()=>pb.click(),600)}
}

/* streamgraph of sectors */
const SECMAP={'Enterprise AI':'AI','Deeptech':'AI','Regtech':'Fintech','Online services':'E-commerce','Foodtech':'E-commerce','HRtech':'SaaS','Govtech':'SaaS','Super apps':'E-commerce'};
function drawStream(root){const el=root.querySelector('#c-stream');const W=el.clientWidth||460,H=280,m={l:8,r:8,t:10,b:22};const svg=svgIn(el,W,H);const ms=S.series.months||[];const other=dt().otherSec;
  const rows=ms.map(mo=>{const o={m:mo.label,total:mo.total};let sum=0;Object.entries(mo.sectors||{}).forEach(([k,v])=>{const kk=SECMAP[k]||k;o[kk]=(o[kk]||0)+v;sum+=v});o[other]=Math.max(0,mo.total-sum);return o});
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r).filter(k=>k!=='m'&&k!=='total')))].sort((a,b)=>a===other?1:b===other?-1:d3.sum(rows,r=>r[b]||0)-d3.sum(rows,r=>r[a]||0));
  const st=d3.stack().keys(keys).value((r,k)=>r[k]||0).offset(d3.stackOffsetWiggle).order(d3.stackOrderInsideOut)(rows);
  const x=d3.scalePoint(rows.map(r=>r.m),[m.l,W-m.r]);const y=d3.scaleLinear([d3.min(st,l=>d3.min(l,d=>d[0])),d3.max(st,l=>d3.max(l,d=>d[1]))],[H-m.b,m.t]);
  const area=d3.area().curve(d3.curveBasis).x((d,i)=>x(rows[i].m)).y0(d=>y(d[0])).y1(d=>y(d[1]));
  const col=k=>k===other?cssv('--paper-2'):indColor(k);
  svg.append('g').selectAll('path').data(st).join('path').attr('d',area).attr('fill',l=>col(l.key)).attr('stroke',l=>l.key===other?hairc():'none').attr('opacity',.9).attr('data-k',l=>'ind:'+l.key).style('cursor','pointer')
   .on('mousemove',(ev,l)=>{const [mx]=d3.pointer(ev);const i=d3.minIndex(rows,r=>Math.abs(x(r.m)-mx));const r=rows[i];gtip(ev,`<b>${esc(l.key===other?other:indL(l.key))}</b><br>${esc(r.m)}: ${esc(money(r[l.key]||0))} ${L==='ar'?'من':'of'} ${esc(money(r.total))}`);rule.attr('x1',x(r.m)).attr('x2',x(r.m)).attr('opacity',1);if(l.key!==other)linkOn('ind',l.key)}).on('mouseleave',()=>{gtipOff();linkOff();rule.attr('opacity',0)}).on('click',(ev,l)=>{if(l.key===other)return;S.ds.industry=S.ds.industry===l.key?null:l.key;soon()});
  const rule=svg.append('line').attr('y1',m.t).attr('y2',H-m.b).attr('stroke',ink()).attr('opacity',0).attr('pointer-events','none');
  svg.append('g').selectAll('text').data(rows.filter((r,i)=>W>520||i%2===0)).join('text').attr('x',r=>x(r.m)).attr('y',H-6).attr('text-anchor','middle').attr('font-size',10).attr('fill',ink2()).text(r=>r.m.split(' ')[0]);
}
/* calendar heatmap */
function drawCal(root){const el=root.querySelector('#c-cal');const W=el.clientWidth||460;const p=d3.timeParse('%Y-%m-%d'),f=d3.timeFormat('%Y-%m-%d');const start=d3.timeWeek.floor(p(S.deals.from)),end=p(S.deals.to);const weeks=d3.timeWeeks(start,d3.timeDay.offset(end,1)).length+1;const cs=Math.min(22,(W-40)/weeks),H=cs*7+34;const svg=svgIn(el,W,H);
  const fd=fDeals();const by=d3.group(fd,x=>x.date);const days=d3.timeDays(start,d3.timeDay.offset(end,1));const mx=d3.max([...by.values()],v=>d3.sum(v,x=>x.amount||.5))||1;const col=d3.scaleSequentialLog([.5,mx],t2=>d3.interpolateRgb(cssv('--paper-2'),popc())(t2));
  const ox=30;svg.append('g').selectAll('rect').data(days).join('rect').attr('x',dd=>ox+d3.timeWeek.count(start,dd)*cs).attr('y',dd=>18+dd.getDay()*cs).attr('width',cs-2).attr('height',cs-2).attr('rx',3).attr('fill',dd=>{const v=by.get(f(dd));return v?col(Math.max(.5,d3.sum(v,x=>x.amount||.5))):cssv('--paper-2')}).attr('opacity',dd=>by.get(f(dd))?1:.45).attr('data-k',dd=>(by.get(f(dd))||[]).map(keysOf).join('|')||'none').style('cursor',dd=>by.get(f(dd))?'pointer':'default')
   .on('mousemove',(ev,dd)=>{const v=by.get(f(dd));gtip(ev,`<b>${esc(fmtDate(f(dd)))}</b><br>${v?v.map(x=>esc(x.company)+' '+esc(x.amount?money(x.amount):'—')).join('<br>'):'—'}`)}).on('mouseleave',gtipOff).on('click',(ev,dd)=>{if(!by.get(f(dd)))return;const w0=d3.timeWeek.floor(dd),w1=d3.timeDay.offset(w0,6);S.ds.r0=f(w0);S.ds.r1=f(w1);soon()});
  const dn=L==='ar'?['ح','ن','ث','ر','خ','ج','س']:['S','M','T','W','T','F','S'];svg.append('g').selectAll('text').data(dn).join('text').attr('x',ox-6).attr('y',(dd,i)=>18+i*cs+cs/2+3).attr('text-anchor','end').attr('font-size',9).attr('fill',ink2()).text(dd=>dd);
  svg.append('g').selectAll('text').data(d3.timeMonths(start,end)).join('text').attr('x',dd=>ox+d3.timeWeek.count(start,dd)*cs).attr('y',12).attr('font-size',10).attr('font-weight',700).attr('fill',ink2()).text(dd=>dd.toLocaleDateString(loc(),{month:'short'}));
}
/* zoomable circle packing */
function drawPack(root){const el=root.querySelector('#c-pack');const W=el.clientWidth||460,H=Math.min(W,420);const svg=svgIn(el,W,H).style('cursor','pointer');const fd=fDeals();
  const data={name:'MENA',children:d3.groups(fd,x=>x.market).map(([mk,v])=>({name:mk,lvl:'mk',children:d3.groups(v,x=>x.industry).map(([ind,w])=>({name:ind,lvl:'ind',mk,children:w.map(x=>({name:x.company,lvl:'co',x,value:Math.max(.4,x.amount||.4)}))}))}))};
  const rootH=d3.pack().size([W,H]).padding(3)(d3.hierarchy(data).sum(dd=>dd.value||0).sort((a,b)=>b.value-a.value));let focus=rootH,view;const g=svg.append('g').attr('transform',`translate(${W/2},${H/2})`);
  const node=g.selectAll('circle').data(rootH.descendants().slice(1)).join('circle').attr('fill',n=>n.data.lvl==='co'?indColor(n.data.x.industry):n.data.lvl==='ind'?indColor(n.data.name):cssv('--paper-2')).attr('fill-opacity',n=>n.data.lvl==='co'?.9:n.data.lvl==='ind'?.25:1).attr('stroke',n=>n.data.lvl==='mk'?hairc():'none').attr('data-k',n=>n.data.lvl==='co'?keysOf(n.data.x):n.data.lvl==='ind'?'ind:'+n.data.name+'|mk:'+n.data.mk:'mk:'+n.data.name)
   .on('mousemove',(ev,n)=>{gtip(ev,n.data.lvl==='co'?dealTip(n.data.x):`<b>${esc(n.data.lvl==='mk'?MKT_FULL(n.data.name):indL(n.data.name))}</b><br>${esc(money(d3.sum(n.leaves(),l=>l.data.x.amount||0)))} · ${esc(dt().deals(n.leaves().length))}<br><i class="muted">${esc(dt().open)}</i>`)}).on('mouseleave',gtipOff)
   .on('click',(ev,n)=>{ev.stopPropagation();if(n.data.lvl==='co'){openDeal(n.data.x);return}zoom(focus===n?n.parent:n)});
  const label=g.selectAll('text').data(rootH.descendants().slice(1)).join('text').attr('text-anchor','middle').attr('font-size',n=>n.data.lvl==='mk'?13:11).attr('font-weight',800).attr('fill',ink()).attr('pointer-events','none').style('display',n=>n.parent===rootH?'inline':'none').text(n=>n.data.lvl==='mk'?n.data.name:n.data.lvl==='ind'?indL(n.data.name):n.data.name);
  const zoomTo=v=>{const k=Math.min(W,H)/v[2];view=v;label.attr('transform',n=>`translate(${(n.x-v[0])*k},${(n.y-v[1])*k+(n.children&&n.parent===focus?-n.r*k+14:4)})`).attr('opacity',n=>n.r*k>(n.data.lvl==='co'?18:24)?1:0);node.attr('transform',n=>`translate(${(n.x-v[0])*k},${(n.y-v[1])*k})`).attr('r',n=>n.r*k)};
  const zoom=n=>{if(!n)return;focus=n;label.style('display',l=>l.parent===focus?'inline':'none');svg.transition().duration(650).tween('zoom',()=>{const i=d3.interpolateZoom(view,[n.x,n.y,n.r*2]);return t2=>zoomTo(i(t2))})};
  svg.on('click',()=>zoom(rootH));zoomTo([rootH.x,rootH.y,rootH.r*2]);
  root.querySelector('#s-pack').textContent=dt().zoomOut+' · '+dt().src+' '+dt().srcDeals;
}
/* force network: investors and companies */
function drawNet(root){const el=root.querySelector('#c-net');const W=el.clientWidth||460,H=Math.max(340,Math.min(460,W*.85));const svg=svgIn(el,W,H);const fd=fDeals().filter(x=>(x.investors||[]).length&&!x.investors.every(i=>/angel/i.test(i.name)));
  const nodes=new Map(),links=[];fd.forEach(x=>{const ck='c:'+x.company;if(!nodes.has(ck))nodes.set(ck,{id:ck,name:x.company,t:'c',x0:x,amt:x.amount||0,deg:0});x.investors.forEach(i=>{const ik='i:'+i.name;if(!nodes.has(ik))nodes.set(ik,{id:ik,name:i.name,t:'i',deg:0,lead:0,deals:[]});const n=nodes.get(ik);n.deg++;n.deals.push(x);if(i.lead)n.lead++;nodes.get(ck).deg++;links.push({source:ik,target:ck,lead:i.lead})})});
  const N=[...nodes.values()];const r=n=>n.t==='i'?4+Math.sqrt(n.deg)*4:3+Math.sqrt(n.amt||1)*1.1;
  const sim=d3.forceSimulation(N).force('l',d3.forceLink(links).id(n=>n.id).distance(34).strength(.6)).force('ch',d3.forceManyBody().strength(-42)).force('x',d3.forceX(W/2).strength(.07)).force('y',d3.forceY(H/2).strength(.09)).force('c',d3.forceCollide(n=>r(n)+2));
  const lk=svg.append('g').selectAll('line').data(links).join('line').attr('stroke',hairc()).attr('stroke-width',l=>l.lead?2:1).attr('stroke-opacity',.9);
  const nd=svg.append('g').selectAll('g').data(N).join('g').style('cursor','pointer').attr('data-k',n=>n.t==='c'?keysOf(n.x0):'inv:'+n.name+'|'+n.deals.map(x=>'co:'+x.company+'|mk:'+x.market+'|ind:'+x.industry).join('|'));
  nd.append('circle').attr('r',r).attr('fill',n=>n.t==='i'?ink():indColor(n.x0.industry)).attr('stroke',cssv('--paper')).attr('stroke-width',1.2);
  nd.append('text').attr('dy',n=>-r(n)-3).attr('text-anchor','middle').attr('font-size',n=>n.t==='i'?10:9).attr('font-weight',n=>n.t==='i'?800:600).attr('fill',ink()).attr('pointer-events','none').text(n=>n.t==='i'&&n.deg>=2?n.name:n.t==='c'&&n.amt>=20?n.name:'');
  const nb=new Map(N.map(n=>[n.id,new Set([n.id])]));links.forEach(l=>{nb.get(l.source.id||l.source).add(l.target.id||l.target);nb.get(l.target.id||l.target).add(l.source.id||l.source)});
  nd.on('mouseenter',(ev,n)=>{const s2=nb.get(n.id);nd.attr('opacity',m2=>s2.has(m2.id)?1:.12);lk.attr('stroke',l=>l.source.id===n.id||l.target.id===n.id?popc():hairc()).attr('stroke-opacity',l=>l.source.id===n.id||l.target.id===n.id?1:.15);nd.select('text').text(m2=>s2.has(m2.id)?m2.name:'')})
   .on('mousemove',(ev,n)=>gtip(ev,n.t==='i'?`<b>${esc(n.name)}</b><br>${esc(dt().deals(n.deg))}${n.lead?` · ${n.lead}★ ${esc(dt().lead)}`:''}<br>${n.deals.slice(0,6).map(x=>esc(x.company)).join(', ')}<br><i class="muted">${esc(dt().open)}</i>`:dealTip(n.x0)))
   .on('mouseleave',()=>{gtipOff();nd.attr('opacity',1);lk.attr('stroke',hairc()).attr('stroke-opacity',.9);nd.select('text').text(n=>n.t==='i'&&n.deg>=2?n.name:n.t==='c'&&n.amt>=20?n.name:'')})
   .on('click',(ev,n)=>{if(ev.defaultPrevented)return;n.t==='i'?go({tab:'dash',ent:{k:'investor',v:n.name}}):openDeal(n.x0)})
   .call(d3.drag().on('start',(ev,n)=>{if(!ev.active)sim.alphaTarget(.3).restart();n.fx=n.x;n.fy=n.y}).on('drag',(ev,n)=>{n.fx=ev.x;n.fy=ev.y}).on('end',(ev,n)=>{if(!ev.active)sim.alphaTarget(0);n.fx=null;n.fy=null}));
  sim.on('tick',()=>{N.forEach(n=>{const rr=r(n);n.x=Math.max(rr,Math.min(W-rr,n.x));n.y=Math.max(rr+10,Math.min(H-rr,n.y))});lk.attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);nd.attr('transform',n=>`translate(${n.x},${n.y})`)});
  root.querySelector('#s-net').textContent=(L==='ar'?'الدوائر الداكنة مستثمرين، والملونة شركات. الخط العريض = قاد الجولة. اسحب أي دائرة. ':'Dark circles are investors, coloured ones companies. Thick line = led the round. Drag any node. ')+dt().src+' '+dt().srcDeals;
}
/* 3-layer sankey */
function drawSankey2(root){const el=root.querySelector('#c-sankey');const W=el.clientWidth||900,H=W<600?420:400;const fd=fDeals().filter(x=>x.amount&&(x.investors||[]).length);if(!fd.length||!d3.sankey){el.innerHTML='<p class="muted">—</p>';return}
  const share=[];fd.forEach(x=>x.investors.forEach(i=>share.push({inv:i.name,x,v:x.amount/x.investors.length})));const it=d3.rollup(share,v=>d3.sum(v,y=>y.v),y=>y.inv);const keep=new Set([...it.entries()].sort((a,b)=>b[1]-a[1]).slice(0,W<600?8:12).map(e=>e[0]));const oth=dt().others;
  const agg=new Map();const add=(s1,t1,v,x)=>{const k=s1+'>'+t1;const o=agg.get(k)||{source:s1,target:t1,value:0,deals:new Set()};o.value+=v;o.deals.add(x.company);agg.set(k,o)};
  share.forEach(s1=>{const iv='i:'+(keep.has(s1.inv)?s1.inv:oth);add(iv,'s:'+s1.x.industry,s1.v,s1.x);add('s:'+s1.x.industry,'m:'+s1.x.market,s1.v,s1.x)});
  const links=[...agg.values()].map(l=>({...l,deals:[...l.deals]}));const nodes=[...new Set(links.flatMap(l=>[l.source,l.target]))].map(id=>({id}));
  const gr=d3.sankey().nodeId(n=>n.id).nodeWidth(12).nodePadding(9).nodeSort(null).extent([[4,6],[W-4,H-6]])({nodes,links});const svg=svgIn(el,W,H);
  const nm=id=>id[0]==='i'?id.slice(2):id[0]==='s'?indL(id.slice(2)):MKT_FULL(id.slice(2));const kOf=id=>id[0]==='i'?'inv:'+id.slice(2):id[0]==='s'?'ind:'+id.slice(2):'mk:'+id.slice(2);
  const lp=svg.append('g').attr('fill','none').selectAll('path').data(gr.links).join('path').attr('d',d3.sankeyLinkHorizontal()).attr('stroke',l=>indColor((l.source.id[0]==='s'?l.source:l.target).id.slice(2))).attr('stroke-width',l=>Math.max(1,l.width)).attr('stroke-opacity',.38).attr('data-k',l=>kOf(l.source.id)+'|'+kOf(l.target.id)+'|'+l.deals.map(c=>'co:'+c).join('|'));
  lp.on('mousemove',(ev,l)=>gtip(ev,`<b>${esc(nm(l.source.id))}</b> → <b>${esc(nm(l.target.id))}</b><br>${esc(money(l.value))}<br>${esc(l.deals.join(', '))}`)).on('mouseleave',gtipOff);
  const nd=svg.append('g').selectAll('g').data(gr.nodes).join('g').style('cursor','pointer').attr('data-k',n=>kOf(n.id));
  nd.append('rect').attr('x',n=>n.x0).attr('y',n=>n.y0).attr('width',n=>n.x1-n.x0).attr('height',n=>Math.max(2,n.y1-n.y0)).attr('fill',n=>n.id[0]==='s'?indColor(n.id.slice(2)):n.id[0]==='m'?popc():ink());
  nd.append('text').attr('x',n=>n.x0<W/2?n.x1+5:n.x0-5).attr('y',n=>(n.y0+n.y1)/2+4).attr('text-anchor',n=>n.x0<W/2?'start':'end').attr('font-size',W<600?9:11).attr('fill',ink()).text(n=>nm(n.id)+(n.y1-n.y0>14?' '+money(n.value):''));
  nd.on('mouseenter',(ev,n)=>lp.attr('stroke-opacity',l=>l.source===n||l.target===n?.85:.06)).on('mousemove',(ev,n)=>gtip(ev,`<b>${esc(nm(n.id))}</b><br>${esc(money(n.value))}`)).on('mouseleave',()=>{lp.attr('stroke-opacity',.38);gtipOff()}).on('click',(ev,n)=>{const v=n.id.slice(2);if(n.id[0]==='i'){if(v!==oth)go({tab:'dash',ent:{k:'investor',v}})}else if(n.id[0]==='s'){S.ds.industry=S.ds.industry===v?null:v;soon()}else{S.ds.market=S.ds.market===v?null:v;soon()}});
  root.querySelector('#s-sankey').textContent=(L==='ar'?'المبلغ موزع بالتساوي على مستثمري كل صفقة لأن حصصهم غير معلنة. ':'Each round is split equally across its investors because individual cheques are not disclosed. ')+dt().src+' '+dt().srcDeals;
}

function drawCmp(root){const el=root.querySelector('#cmpx');if(!el)return;const [a,b]=S.ds.cmp;const ms=S.series.months||[];const opts=['KSA','UAE','EGY','QAT','BHR','JOR','SYR','MAR','OMN','KWT'];
