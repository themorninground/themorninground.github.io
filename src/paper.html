<title>The Morning Round</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a desk-wide newsroom. Masthead bar, tabs, live ticker; front page in three columns on wide screens (wire · lead & grid · money rail), one column on phones. Story pages put the copy beside a sticky fact sheet; Arabic and English can sit side by side. */
:root{
  --paper:#F6F4EF; --sheet:#FFFFFF; --ink:#0F1B2D; --ink-2:#55607A; --ink-3:#8A92A6; --hair:#E2DED4; --hair-2:#CFC9BC;
  --navy:#0B1626; --navy-2:#13233D; --on-navy:#F3EFE6; --signal:#2B6BEA; --signal-soft:#E5EDFD;
  --amber:#9A5A00; --amber-soft:#FBF0DC; --up:#138A4B; --down:#C23A2B; --new:#E2562B;
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --ar:'IBM Plex Sans Arabic','Geeza Pro',Tahoma,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0A111D;--sheet:#101A2A;--ink:#ECE8DF;--ink-2:#A9B1C3;--ink-3:#77809A;--hair:#1E2A3E;--hair-2:#2B3A54;--navy:#060C16;--navy-2:#0E1A2D;--on-navy:#ECE8DF;--signal:#7FA8FF;--signal-soft:#16264A;--amber:#F2BE6B;--amber-soft:#2A2010;--up:#5FD39A;--down:#FF8A7B;--new:#FF8455;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0A111D;--sheet:#101A2A;--ink:#ECE8DF;--ink-2:#A9B1C3;--ink-3:#77809A;--hair:#1E2A3E;--hair-2:#2B3A54;--navy:#060C16;--navy-2:#0E1A2D;--on-navy:#ECE8DF;--signal:#7FA8FF;--signal-soft:#16264A;--amber:#F2BE6B;--amber-soft:#2A2010;--up:#5FD39A;--down:#FF8A7B;--new:#FF8455;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-block:0 0;padding-inline:0}
html[lang="ar"] body{font-family:var(--ar)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.en{font-family:var(--sans);direction:ltr;unicode-bidi:isolate;text-align:left}
.arx{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;text-align:right}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:.8rem}
.hl{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
html[lang="ar"] .hl{font-family:var(--ar);font-weight:700;letter-spacing:0}

/* masthead */
.mast{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.mast .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:64px}
.mast .side{display:flex;align-items:center;gap:10px;font-size:.78rem;color:rgba(243,239,230,.72);min-width:0}
.mast .side.end{justify-content:flex-end}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--on-navy);padding:0;direction:ltr}
.brand svg{width:34px;height:34px;flex:none}
.brand .wm{font-family:var(--serif);font-weight:700;font-size:1.55rem;letter-spacing:-.015em;white-space:nowrap}
.brand .wm i{font-weight:500}
.tagline{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);font-style:italic;font-size:.9rem;color:rgba(243,239,230,.75);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(243,239,230,.28);background:none;color:var(--on-navy);border-radius:999px;padding:5px 12px;font-size:.8rem;min-height:34px;white-space:nowrap}
.pill:hover{border-color:rgba(243,239,230,.6)}
.pill kbd{font-family:var(--mono);font-size:.7rem;opacity:.7;border:1px solid rgba(243,239,230,.3);border-radius:4px;padding:0 4px}
.pill[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.langs{display:inline-flex;border:1px solid rgba(243,239,230,.28);border-radius:999px;overflow:hidden}
.langs button{background:none;border:0;color:var(--on-navy);padding:5px 11px;font-size:.8rem;min-height:34px}
.langs button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--on-navy)}
.tabs{border-top:1px solid rgba(255,255,255,.08)}
.tabs .wrap{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:rgba(243,239,230,.66);padding:11px 0 9px;font-weight:500;font-size:.95rem;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--on-navy)}
.tab[aria-current="page"]{color:var(--on-navy);border-bottom-color:var(--signal);font-weight:600}
@media (max-width:860px){.mast .top{grid-template-columns:auto 1fr;min-height:56px}.mast .side:first-child{display:none}.brand .wm{font-size:1.2rem}.brand svg{width:28px;height:28px}.tagline{display:none}.pill .lbl,.pill kbd{display:none}.tabs .wrap{gap:20px}}

/* ticker */
.ticker{background:var(--navy-2);color:var(--on-navy);overflow:hidden;direction:ltr;border-bottom:1px solid var(--hair)}
.ticker .row{display:flex;align-items:stretch}
.ticker .lab{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--signal);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.ticker .lab i{width:7px;height:7px;border-radius:50%;background:#fff;display:block}
@media (prefers-reduced-motion:no-preference){.ticker .lab i{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
.tview{overflow:hidden;flex:1;min-width:0}
.track{display:flex;width:max-content;animation:tick 70s linear infinite}
.ticker:hover .track,.ticker:focus-within .track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
.tcard{display:flex;align-items:baseline;gap:8px;padding:9px 18px;border-inline-end:1px solid rgba(255,255,255,.08);text-decoration:none;white-space:nowrap;font-size:.84rem}
.tcard:hover{background:rgba(255,255,255,.06)}
.tcard .l{color:rgba(243,239,230,.62)}
.tcard .v{font-family:var(--mono);font-weight:600}
.dir-up{color:#5FD39A;font-family:var(--mono);font-size:.8rem}.dir-down{color:#FF8A7B;font-family:var(--mono);font-size:.8rem}.dir-flat{color:rgba(243,239,230,.55);font-size:.78rem}
.tsrc{font-size:.72rem;color:var(--ink-3);padding-block:6px;text-align:end;direction:ltr}
.tsrc a{color:inherit;text-underline-offset:2px}

/* toolbar: filters */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px 18px;border-bottom:1px solid var(--hair);margin-bottom:22px}
.fsel{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:.86rem;min-height:36px}
.fbtn:hover{border-color:var(--ink-2)}
.fbtn[data-on="1"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fbtn .k{opacity:.65;font-size:.82em}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:25;background:var(--sheet);border:1px solid var(--hair-2);border-radius:var(--r);padding:6px;min-width:210px;box-shadow:0 16px 40px rgba(15,27,45,.16);max-height:340px;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:8px 10px;border-radius:6px;text-align:start;font-size:.9rem}
.menu button:hover,.menu button[aria-pressed="true"]{background:var(--signal-soft)}
.menu .n{color:var(--ink-3);font-family:var(--mono);font-size:.78em}
.invq{border:1px solid var(--hair-2);background:var(--sheet);border-radius:999px;padding:6px 13px;min-height:36px;font:inherit;font-size:.86rem;color:var(--ink);width:190px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--hair-2);border-radius:999px;overflow:hidden;margin-inline-start:auto;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 12px;font-size:.82rem;min-height:34px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.followf{border:1px solid var(--signal);color:var(--signal);background:none;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;min-height:36px}
.followf[aria-pressed="true"]{background:var(--signal);color:#fff}
.count{font-size:.8rem;color:var(--ink-2)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--hair-2);text-underline-offset:3px;font-weight:inherit;text-align:inherit}
.linkish:hover{text-decoration-color:currentColor}

/* front page grid */
.front{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:32px;align-items:start}
.colhead{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);padding-top:8px;margin-bottom:10px}
.colhead h3{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] .colhead h3{letter-spacing:0;font-size:.9rem}
.colhead span{font-size:.75rem;color:var(--ink-3)}
.wire{position:sticky;top:130px}
.wire ol{list-style:none;margin:0;padding:0}
.wire li{border-bottom:1px solid var(--hair)}
.wire button{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;width:100%;background:none;border:0;padding:11px 0;text-align:start}
.wire .tm{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);padding-top:2px}
.wire .tt{font-size:.9rem;line-height:1.35;font-weight:500}
.wire button:hover .tt{color:var(--signal)}
.wire .sm{display:block;font-size:.72rem;color:var(--ink-3);margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new);margin-inline-end:6px;vertical-align:middle}
.newtag{font-size:.68rem;font-weight:700;color:var(--new);letter-spacing:.06em}
.lead{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;text-decoration:none;color:inherit;padding-bottom:22px;border-bottom:1px solid var(--hair);margin-bottom:22px;background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.lead .pic{aspect-ratio:4/3}
.lead h2{font-size:clamp(1.5rem,2.3vw,2.15rem);line-height:1.15;margin:8px 0 10px}
html[lang="ar"] .lead h2{line-height:1.5;font-size:clamp(1.35rem,1.9vw,1.8rem)}
.lead p{margin:0;color:var(--ink-2);font-size:1.02rem}
.lead:hover h2{color:var(--signal)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px}
.card{display:block;background:none;border:0;padding:0;text-align:start;width:100%}
.card .pic{aspect-ratio:16/9;margin-bottom:10px}
.card h3{font-size:1.12rem;line-height:1.3;margin:6px 0 6px}
html[lang="ar"] .card h3{line-height:1.5;font-size:1.05rem}
.card:hover h3{color:var(--signal)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-2)}
.mono{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:.58rem;font-weight:700;font-family:var(--sans);flex:none}
.chip{display:inline-block;border:1px solid var(--hair-2);border-radius:999px;padding:0 8px;font-size:.72rem;color:var(--ink-2);line-height:1.7}
.chip.amt{border-color:var(--ink);color:var(--ink);font-family:var(--mono);font-weight:600}
.chip.lensc{border-color:var(--amber);color:var(--amber)}
.chip.full{border-color:var(--signal);color:var(--signal)}
.pic{position:relative;width:100%;border-radius:6px;overflow:hidden;background:var(--navy-2)}
.pic img,.pic svg{display:block;width:100%;height:100%;object-fit:cover}
.pic img.contain{object-fit:contain;background:#fff;padding:6%}
.cred{position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(6,12,22,.72);color:#F3EFE6;font-size:.68rem;padding:2px 7px;border-radius:4px}
.more{margin-top:28px}
.rowi{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;padding:14px 0;border-top:1px solid var(--hair);background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.rowi .pic{aspect-ratio:4/3}
.rowi h3{font-size:1.02rem;line-height:1.35;margin:4px 0 6px}
.rowi:hover h3{color:var(--signal)}

/* money rail */
.rail .block{margin-bottom:28px}
.rank{list-style:none;margin:0;padding:0}
.rank li button{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:9px 0;border-bottom:1px solid var(--hair);text-align:start}
.rank .i{font-family:var(--mono);font-size:.75rem;color:var(--ink-3)}
.rank .nm{font-weight:600;font-size:.9rem;display:block}
.rank .bar{display:block;height:4px;border-radius:2px;background:var(--signal);margin-top:5px;transform-origin:left;}
html[dir="rtl"] .rank .bar{transform-origin:right}
@media (prefers-reduced-motion:no-preference){.rank .bar{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}}
@keyframes grow{from{transform:scaleX(0)}}
.rank .a{font-family:var(--mono);font-weight:600;font-size:.88rem}
.rank li button:hover .nm{color:var(--signal)}
.lensli{display:block;width:100%;text-align:start;background:var(--amber-soft);border:0;border-inline-start:3px solid var(--amber);padding:10px 12px;margin-bottom:8px;border-radius:0}
.lensli b{display:block;font-size:.88rem}
.lensli span{font-size:.8rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:var(--sheet);border-radius:999px;padding:4px 10px 4px 5px;font-size:.8rem}
html[dir="rtl"] .srcs button{padding:4px 5px 4px 10px}
.srcs .c{font-family:var(--mono);color:var(--ink-3);font-size:.72rem}

/* brief mode */
.brief{border-top:3px solid var(--ink)}
.brief button{display:grid;grid-template-columns:90px 70px minmax(0,1fr) 90px 130px;gap:14px;align-items:baseline;width:100%;background:none;border:0;border-bottom:1px solid var(--hair);padding:10px 0;text-align:start;font-size:.92rem}
.brief button:hover{background:var(--sheet)}
.brief .d{font-family:var(--mono);font-size:.76rem;color:var(--ink-3)}
.brief .ty{font-size:.74rem;color:var(--ink-2)}
.brief .h{font-weight:600}
.brief .a{font-family:var(--mono);font-weight:600;text-align:end}
.brief .s{font-size:.76rem;color:var(--ink-2);text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.brief button{grid-template-columns:62px minmax(0,1fr) 70px}.brief .ty,.brief .s{display:none}}

@media (max-width:1100px){.front{grid-template-columns:minmax(0,1fr) 280px}.wire{display:none}}
@media (max-width:860px){.front{grid-template-columns:minmax(0,1fr)}.lead{grid-template-columns:minmax(0,1fr)}.lead .pic{aspect-ratio:16/9}.grid{grid-template-columns:minmax(0,1fr)}.wire{display:none}}
@media (max-width:520px){.rowi{grid-template-columns:minmax(0,1fr) 96px}.grid .card .pic{aspect-ratio:16/9}}

/* hover peek */
.peek{position:absolute;z-index:45;width:340px;background:var(--sheet);border:1px solid var(--hair-2);border-radius:12px;box-shadow:0 24px 60px rgba(15,27,45,.22);overflow:hidden;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.peek.on{opacity:1;transform:none}
.peek .pic{aspect-ratio:16/8;border-radius:0}
.peek .in{padding:12px 14px}
.peek h4{margin:4px 0 8px;font-size:1rem;line-height:1.35}
.peek .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.8rem}
.peek .kv span:nth-child(odd){color:var(--ink-3)}
.peek .lz{margin-top:8px;font-size:.8rem;border-inline-start:3px solid var(--amber);padding-inline-start:8px;color:var(--ink-2)}

/* command palette */
.cmdk{position:fixed;inset:0;z-index:60;background:rgba(6,12,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.cmdk .box{width:min(640px,100%);background:var(--sheet);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--hair);background:none;padding:16px 18px;font:inherit;font-size:1.05rem;color:var(--ink);outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.cmdk li button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;border-radius:8px;text-align:start}
.cmdk li button[aria-selected="true"]{background:var(--signal-soft)}
.cmdk .k{font-size:.7rem;color:var(--ink-3);min-width:72px;letter-spacing:.04em}
.cmdk .hint{padding:8px 14px;font-size:.74rem;color:var(--ink-3);border-top:1px solid var(--hair)}

/* story */
.back{background:none;border:0;color:var(--signal);font-weight:600;padding:14px 0 10px;font-size:.92rem}
.story{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:44px;align-items:start}
.story .main{min-width:0}
.story h1{font-size:clamp(1.7rem,3vw,2.6rem);line-height:1.12;margin:6px 0 12px}
html[lang="ar"] .story h1{line-height:1.45}
.dek{font-size:1.15rem;color:var(--ink-2);margin:0 0 18px;line-height:1.55}
.byl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);padding-block:12px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-bottom:18px}
.byl .mono{width:28px;height:28px;font-size:.72rem;border-radius:6px}
.byl b{color:var(--ink)}
.fol{border:1px solid var(--signal);color:var(--signal);background:none;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;min-height:32px;white-space:nowrap}
.fol[aria-pressed="true"]{background:var(--signal);color:#fff}
.story .hero .pic{aspect-ratio:16/9;border-radius:8px}
.picnote{font-size:.76rem;color:var(--ink-3);margin:8px 0 22px}
.readas{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-2);margin-bottom:16px;flex-wrap:wrap}
.readas button{border:1px solid var(--hair-2);background:var(--sheet);border-radius:999px;padding:4px 12px;min-height:32px}
.readas button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.body{font-size:1.08rem}
.body p{margin:0;line-height:1.85}
.body .en p,.body p.en{font-family:var(--serif);font-size:1.16rem;line-height:1.7}
.para{padding:8px 0 14px}
.para+.para{border-top:1px solid var(--hair);padding-top:14px}
.para.both{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.para.both .colx{min-width:0}
.pfoot{display:flex;gap:14px;margin-top:6px;grid-column:1/-1}
.pbtn{border:0;background:none;color:var(--signal);font-size:.8rem;font-weight:600;padding:4px 0;min-height:30px}
.pbtn:hover{text-decoration:underline}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--signal);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help}
.notes{grid-column:1/-1}
.note{margin:10px 0 4px;border-inline-start:3px solid var(--signal);background:var(--signal-soft);padding:10px 12px;font-size:.95rem;position:relative}
.note .q{font-size:.78rem;color:var(--ink-2);margin-bottom:4px;padding-inline-end:28px}
.note .x{position:absolute;top:4px;inset-inline-end:4px;border:0;background:none;width:28px;height:28px;font-size:1.1rem;color:var(--ink-2)}
.note p{margin:0;line-height:1.8;white-space:pre-wrap}
.note .from{font-size:.7rem;color:var(--ink-3);margin-top:6px}
.why{border-top:3px solid var(--ink);margin-top:26px;padding-top:12px}
.why p{margin:6px 0 0;line-height:1.85}
.gloss{margin-top:26px}
.gloss dl{margin:8px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.gloss dt{font-weight:600;font-family:var(--sans)}
.gloss dt span{font-family:var(--ar);font-weight:500;color:var(--ink-2);margin-inline-start:8px}
.gloss dd{margin:2px 0 0;font-family:var(--ar);direction:rtl;line-height:1.75;color:var(--ink-2);font-size:.92rem}
@media (max-width:640px){.gloss dl{grid-template-columns:minmax(0,1fr)}}
.factside{position:sticky;top:130px;display:grid;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.sheet .hd{padding:10px 14px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center}
.big{padding:14px 14px 4px}
.big .v{font-family:var(--mono);font-size:2rem;font-weight:600;line-height:1}
.big .s{font-size:.8rem;color:var(--ink-2);margin-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;padding:12px 14px;font-size:.88rem}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600;overflow-wrap:anywhere}
.invs{padding:4px 14px 14px;display:grid;gap:6px}
.invs button{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--hair);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:.85rem;text-align:start}
.invs button:hover{border-color:var(--signal)}
.invs small{display:block;color:var(--ink-3);font-size:.72rem}
.invs .ld{font-size:.66rem;font-weight:700;color:var(--signal);letter-spacing:.06em}
.lensbox{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:12px;padding:14px 16px}
.lensbox h4{margin:0 0 6px;color:var(--amber);font-size:.78rem;letter-spacing:.06em}
.lensbox p{margin:0;line-height:1.8;font-size:.95rem}
.orig{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:10px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600}
.origsub{text-align:center;font-size:.74rem;color:var(--ink-3);margin-top:-8px}
.pending{margin:6px 0 18px;padding:12px 14px;border:1px dashed var(--hair-2);border-radius:10px;color:var(--ink-2);font-size:.92rem}
@media (max-width:980px){.story{grid-template-columns:minmax(0,1fr)}.factside{position:static}.para.both{grid-template-columns:minmax(0,1fr)}}

/* entity */
.ent h1{font-size:clamp(1.6rem,3vw,2.4rem);margin:6px 0 8px}
.stats{display:flex;gap:28px;margin:14px 0 18px;flex-wrap:wrap}
.stats b{display:block;font-size:1.5rem;font-family:var(--mono);font-weight:600}.stats span{font-size:.78rem;color:var(--ink-2)}
.soon{padding:70px 0;text-align:center}
.soon h2{margin:0 0 8px;font-size:1.8rem}
.soon p{color:var(--ink-2);margin:0 auto;max-width:440px}
.empty{padding:50px 0;text-align:center;color:var(--ink-2)}

footer{margin-top:64px;background:var(--navy);color:rgba(243,239,230,.75)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-block:22px;font-size:.8rem;direction:ltr}
footer i{font-family:var(--serif);font-size:.95rem;color:var(--on-navy)}

.selbar{position:absolute;z-index:50;display:flex;gap:2px;background:var(--navy);color:var(--on-navy);border-radius:10px;padding:4px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.selbar button{background:none;border:0;color:var(--on-navy);padding:8px 12px;border-radius:7px;font-size:.86rem;font-weight:600;min-height:38px;font-family:var(--ar)}
.selbar button:hover{background:rgba(255,255,255,.12)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:70}
.flame{flex:none;overflow:visible}.flame .fo{fill:#E2562B}.flame .fi{fill:#F7B538}
@media (prefers-reduced-motion:no-preference){.flame{transform-origin:50% 95%;animation:fk 1.6s ease-in-out infinite}.flame .fi{transform-origin:50% 90%;animation:fki 1.1s ease-in-out infinite}}
@keyframes fk{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.96,1.05) skewX(-2deg)}50%{transform:scale(1.03,.97) skewX(1.5deg)}75%{transform:scale(.98,1.04) skewX(-1deg)}}
@keyframes fki{0%,100%{transform:scale(1)}40%{transform:scale(.88,1.08)}70%{transform:scale(1.06,.94)}}

<script>
const T={
  ar:{tabs:{dash:'داشبورد',news:'أخبار',articles:'مقالات',reports:'تقارير',foryou:'For You'},
    type:'النوع',industry:'القطاع',market:'السوق',all:'الكل',inv:'ابحث عن مستثمر',follow:'Follow',following:'تتابعه ✓',followf:'تابع هالفلتر',followingf:'تتابع هالفلتر ✓',
    types:{deal:'صفقة',news:'خبر',exit:'تخارج',ipo:'طرح عام'},items:n=>n+' عنصر',none:'ما فيه شي يطابق هالفلاتر.',clear:'امسح الفلاتر',
    layout:'العرض',lFront:'الصفحة الأولى',lBrief:'سريع',latest:'آخر الأخبار',biggest:'أكبر الجولات',tali:'من عدسة تالي',sources:'المصادر',newSince:n=>n+' جديد من آخر زيارة',isNew:'جديد',more:'المزيد',
    back:'→ رجوع',from:'عن',photo:'الصورة:',readIn:'اقرأ:',arabic:'عربي',english:'English',both:'الاثنين جنب بعض',amount:'المبلغ',stage:'المرحلة',structure:'نوع التمويل',investors:'المستثمرين',industryK:'القطاع',marketK:'السوق',dateK:'التاريخ',companyK:'الشركة',sheet:'ورقة الصفقة',lead:'قائد',
    lens:'عدسة تالي',why:'ليش هذا مهم؟',terms:'المصطلحات',explainP:'اشرح الفقرة',arP:'شوفها بالعربي',enP:'Show in English',readOrig:'اقرأ الأصل عند',origSub:'الرابط يفتح الخبر نفسه',
    pending:'هذا الخبر للحين بنسخته القصيرة. النسخة الكاملة بالشرح تنزل في الخطوة 2.',
    sel:{explain:'اشرح',translate:'ترجم'},explaining:'Claude يكتب الشرح…',noteE:'شرح',noteT:'ترجمة',paraFallback:'شرح الفقرة كاملة:',paraTrans:'ترجمة الفقرة:',noSpeech:'النطق غير متاح في هذا المتصفح',
    ent:{company:'شركة',investor:'مستثمر',source:'مصدر',term:'مصطلح'},deals:'صفقات',total:'إجمالي معلن',stories:'أخبار',search:'بحث',searchPh:'ابحث عن شركة، مستثمر، مصدر، مصطلح…',searchHint:'↑↓ للتنقل · Enter للفتح · Esc للإغلاق',
    soon:{dash:['الداشبورد','رسوم D3 تفاعلية لأرقام السوق. يُبنى في الخطوة 6، بعد ما تتعبى الأخبار.'],articles:['مقالات','مقالات تحليل عربية وعالمية مع شرحها الكامل. تُبنى في الخطوة 4.'],reports:['تقارير','تقارير SVC ومنشآت وWamda وMAGNiTT مشروحة. تُبنى في الخطوة 4.'],foryou:['For You','مجالك، والـ Watchlist، والمتابعات، وLearn. تُبنى في الخطوة 5.']},
    followed:'انضاف لمتابعاتك',unfollowed:'انشال من متابعاتك',undisclosed:'غير معلن'},
  en:{tabs:{dash:'Dashboard',news:'News',articles:'Articles',reports:'Reports',foryou:'For You'},
    type:'Type',industry:'Industry',market:'Market',all:'All',inv:'Search an investor',follow:'Follow',following:'Following ✓',followf:'Follow this filter',followingf:'Following this filter ✓',
    types:{deal:'Deal',news:'News',exit:'Exit',ipo:'IPO'},items:n=>n+' items',none:'Nothing matches these filters.',clear:'Clear filters',
    layout:'View',lFront:'Front page',lBrief:'Brief',latest:'Latest',biggest:'Biggest rounds',tali:'Through the Tali Lens',sources:'Sources',newSince:n=>n+' new since your last visit',isNew:'NEW',more:'More',
    back:'← Back',from:'From',photo:'Photo:',readIn:'Read in:',arabic:'عربي',english:'English',both:'Side by side',amount:'Amount',stage:'Stage',structure:'Structure',investors:'Investors',industryK:'Industry',marketK:'Market',dateK:'Date',companyK:'Company',sheet:'Deal sheet',lead:'LEAD',
    lens:'Tali Lens',why:'Why it matters',terms:'Terms',explainP:'Explain this paragraph',arP:'Show in Arabic',enP:'Show in English',readOrig:'Read the original at',origSub:'Opens the exact story',
    pending:'This item is still in its short form. The full version with explanations arrives in step 2.',
    sel:{explain:'Explain',translate:'Translate'},explaining:'Claude is writing…',noteE:'Explanation',noteT:'Translation',paraFallback:'Paragraph explanation:',paraTrans:'Paragraph translation:',noSpeech:'Speech is not available in this browser',
    ent:{company:'Company',investor:'Investor',source:'Source',term:'Term'},deals:'Deals',total:'Disclosed total',stories:'Stories',search:'Search',searchPh:'Search a company, investor, source, term…',searchHint:'↑↓ to move · Enter to open · Esc to close',
    soon:{dash:['Dashboard','Interactive D3 charts of the market. Built in step 6, once the news is filled in.'],articles:['Articles','Arabic and global analysis with full explanations. Built in step 4.'],reports:['Reports','SVC, Monsha\'at, Wamda and MAGNiTT reports, explained. Built in step 4.'],foryou:['For You','Your field, watchlist, follows and Learn. Built in step 5.']},
    followed:'Added to your follows',unfollowed:'Removed from your follows',undisclosed:'Undisclosed'}
};
const TABS=['dash','news','articles','reports','foryou'];
const S={items:[],rounds:[],market:null,me:{follows:[]},ready:false,view:{tab:'news'},stack:[],f:{type:'',industry:'',market:'',inv:''},layout:'front',readMode:null};
let L='ar';try{L=localStorage.getItem('mr2-lang')||'ar'}catch(e){}
try{Object.assign(S.f,JSON.parse(localStorage.getItem('mr2-filters')||'{}'))}catch(e){}
try{S.layout=localStorage.getItem('mr2-layout')||'front'}catch(e){}
let LAST='';try{LAST=localStorage.getItem('mr2-last')||'';localStorage.setItem('mr2-last',new Date().toISOString().slice(0,10))}catch(e){}
const t=()=>T[L];
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
const D=s=>new Date((s||'')+'T12:00:00');
const fmtDate=s=>L==='ar'?D(s).toLocaleDateString('ar-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}):D(s).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const fmtShort=s=>D(s).toLocaleDateString(L==='ar'?'ar-u-ca-gregory-nu-latn':'en-GB',{day:'numeric',month:'short'});
const money=m=>m==null?t().undisclosed:m>=1000?'$'+(m/1000).toFixed(2).replace(/\.?0+$/,'')+'B':m>=1?'$'+(+m.toFixed(2))+'M':'$'+Math.round(m*1000)+'K';
const amt=n=>n.amountLabel||money(n.amount);
const C=(n,k)=>(n[L]&&n[L][k])||(n.en&&n.en[k])||'';
const mono=s=>esc(String(s||'?').replace(/^(the|via)\s+/i,'').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase());
const srcName=n=>(n.source&&n.source.name)||'';
const IMG_BASE=window.MR_IMG_BASE||null;
const imgSrc=n=>n.image?(IMG_BASE?IMG_BASE+n.image.file:(n.image.asset||null)):null;
const isNew=n=>LAST&&n.date>LAST;
const typeL=n=>t().types[n.type]||n.type;

function cover(n,w,h){
  const big=n.type==='deal'&&n.amount!=null?amt(n):(n.company||n.industry||'News');const sub=[n.stage,n.industry,n.market].filter(Boolean).join(' · ');
  const fs=Math.min(h*.42,(w*.84)/(Math.max(big.length,3)*.62));const k=Math.max(10,Math.min(h*.07,15));
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" direction="ltr" style="direction:ltr"><rect width="${w}" height="${h}" fill="#13233D"/>${[1,2,3,4,5].map(i=>`<line x1="0" x2="${w}" y1="${h*i/6}" y2="${h*i/6}" stroke="#F3EFE6" stroke-opacity=".06"/>`).join('')}<rect x="${w*.07}" y="${h*.18}" width="${w*.08}" height="3" fill="#2B6BEA"/><text x="${w*.07}" y="${h*.66}" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="${fs.toFixed(1)}" fill="#F3EFE6">${esc(big)}</text><text x="${w*.07}" y="${h*.66+k*1.9}" font-family="IBM Plex Sans,sans-serif" font-size="${k}" fill="#F3EFE6" fill-opacity=".65">${esc(sub)}</text></svg>`;
}
function pic(n,w,h,credit){const s=imgSrc(n);if(s)return `<div class="pic"><img src="${esc(s)}" alt="${esc(n.image.alt?(n.image.alt[L]||n.image.alt.en):'')}" loading="lazy"${n.image.fit==='contain'?' class="contain"':''} data-fallback="${esc(n.id)}">${credit?`<span class="cred">${esc(t().photo)} ${esc(n.image.credit)}</span>`:''}</div>`;return `<div class="pic">${cover(n,w,h)}</div>`}
function fixImgs(root){root.querySelectorAll('img[data-fallback]').forEach(im=>im.addEventListener('error',()=>{const n=S.items.find(x=>x.id===im.dataset.fallback);if(n)im.parentElement.innerHTML=cover(n,640,360)},{once:true}))}

/* ===== data ===== */
let DB=null,SAMPLE=null;
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function soon(){clearTimeout(soon.t);soon.t=setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},30)}
(async()=>{
  const c=window.claude;
  DB=c&&await c.use('db');
  if(!DB){$('#loading').textContent='The paper could not load its data.';return}
  DB.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));S.ready=true;soon();renderTicker()});
  DB.doc('meta/market').onSnapshot(s=>{S.market=s.exists?s.data():null;renderTicker()});
  DB.collection('rounds').onSnapshot(s=>{S.rounds=s.docs.map(d=>({id:d.id,...d.data()}));renderMast()});
  DB.doc('me/state').onSnapshot(s=>{S.me=Object.assign({follows:[]},s.exists?s.data():{});soon()});
  try{SAMPLE=await c.use('sample')}catch(e){SAMPLE=null}
})();
async function saveMe(){if(!DB)return;try{await DB.doc('me/state').set(S.me)}catch(e){toast('Could not save')}}
const fkey=(k,v)=>k+':'+v;
const isF=(k,v)=>(S.me.follows||[]).some(f=>f.key===fkey(k,v));
function toggleF(k,v,label){const key=fkey(k,v);const fs=S.me.follows||[];const i=fs.findIndex(f=>f.key===key);if(i>=0){fs.splice(i,1);toast(t().unfollowed)}else{fs.push({key,k,v,label:label||v,at:new Date().toISOString()});toast(t().followed)}S.me.follows=fs;saveMe();soon()}

/* ===== chrome ===== */
function setLang(l){L=l;try{localStorage.setItem('mr2-lang',l)}catch(e){}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('#lAr').setAttribute('aria-pressed',String(l==='ar'));$('#lEn').setAttribute('aria-pressed',String(l==='en'));$('#cmdLbl').textContent=t().search;render();renderTicker();renderMast()}
$('#lAr').onclick=()=>setLang('ar');$('#lEn').onclick=()=>setLang('en');
$('#home').onclick=()=>go({tab:'news'},true);
function renderTabs(){const cur=S.view.tab||'news';$('#tabs').innerHTML=TABS.map(k=>`<button class="tab" data-tab="${k}" ${k===cur?'aria-current="page"':''}>${esc(t().tabs[k])}</button>`).join('');$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go({tab:b.dataset.tab},true))}
function computeStreak(){const s=S.rounds.filter(r=>!r.preview&&r.type!=='weekend').sort((a,b)=>a.no-b.no);let n=0;for(let i=s.length-1;i>=0;i--){const r=s[i];if(r.status==='read'||r.status==='madeup')n++;else if(r.status==='pending'&&i===s.length-1)continue;else break}return n}
function flameSVG(n,base){if(!n)return '';const sz=Math.round(base*(n>=20?1.6:n>=10?1.35:n>=5?1.15:1));return `<svg class="flame" width="${sz}" height="${sz}" viewBox="0 0 32 40" role="img" aria-label="${n}-day streak"><path class="fo" d="M16 2c1.6 6.2 9.8 10.4 9.8 20.2C25.8 32 21.4 38 16 38S6.2 32.6 6.2 24.6c0-5.6 3.4-8.6 5.2-12 .6 3 1.8 5 3.6 6C15.6 13 14.4 7.6 16 2z"/><path class="fi" d="M16.4 17c.8 3.4 5 5.6 5 10.8 0 4.6-2.4 7.4-5.4 7.4s-5.4-2.6-5.4-6.6c0-2.8 1.6-4.4 2.6-6 .4 1.6 1 2.6 2 3.2.4-3-.2-5.6 1.2-8.8z"/></svg>`}
function renderMast(){
  const rs=S.rounds.filter(r=>!r.preview);const no=rs.length?Math.max(...rs.map(r=>r.no||0)):0;const sk=computeStreak();
  const d=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('#mastL').innerHTML=`<span style="direction:ltr">Riyadh · ${esc(d)}</span>${no?`<span style="opacity:.5">|</span><span>Round <b style="color:var(--on-navy)">${no}</b></span><span class="streak">${sk}${flameSVG(sk,15)}</span>`:`<span class="tagline">Every page compounds.</span>`}`;
}
function renderTicker(){
  const m=S.market;if(!m){$('#ticker').innerHTML='';$('#tsrc').innerHTML='';return}
  const tc=(x,u)=>`<a class="tcard" href="${esc(safeUrl(u))}" target="_blank" rel="noopener"><span class="l">${esc(x.label)}</span><span class="v">${esc(x.value)}</span>${x.delta?`<span class="dir-${esc(x.dir||'flat')}">${x.dir==='up'?'▲':x.dir==='down'?'▼':''} ${esc(x.delta)}</span>`:''}</a>`;
  const deals=S.items.filter(n=>n.type==='deal'&&n.amount).sort((a,b)=>b.amount-a.amount).slice(0,6).map(n=>tc({label:n.company+(n.stage?' · '+n.stage:''),value:amt(n),dir:'flat',delta:n.market},n.source.url));
  const cards=(m.ticker||[]).map(x=>tc(x,m.url)).join('')+deals.join('');
  $('#ticker').innerHTML=cards+cards;
  $('#tsrc').innerHTML=`Market figures: <a href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener">${esc(m.sourceShort||'Source')}</a> · Deals link to each company's story`;
}
function go(v,reset){hidePeek();if(reset)S.stack=[];else S.stack.push({view:S.view,y:window.scrollY});S.view=v;S.readMode=null;render();window.scrollTo(0,0)}
function goBack(){hidePeek();const p=S.stack.pop();S.view=p?p.view:{tab:'news'};S.readMode=null;render();window.scrollTo(0,p?p.y:0)}

/* ===== news ===== */
const sorted=()=>S.items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.full?1:0)-(a.full?1:0));
function match(n,f,skip){return (skip==='type'||!f.type||n.type===f.type)&&(skip==='industry'||!f.industry||n.industry===f.industry)&&(skip==='market'||!f.market||n.market===f.market)&&(!f.inv||(n.investors||[]).some(i=>i.name.toLowerCase().includes(f.inv.toLowerCase())))}
function options(key){const m={};S.items.filter(n=>match(n,S.f,key)).forEach(n=>{const v=n[key];if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const fLabel=(k,v)=>k==='type'?t().types[v]||v:v;
function filterKey(){return ['type','industry','market','inv'].map(k=>S.f[k]?k+'='+S.f[k]:'').filter(Boolean).join('&')}
function saveFilters(){try{localStorage.setItem('mr2-filters',JSON.stringify(S.f))}catch(e){}}

const chips=n=>`<span class="meta" style="margin-top:6px">${n.type==='deal'?`<span class="chip amt">${esc(amt(n))}</span>`:''}<span class="chip">${esc(typeL(n))}</span><span class="chip">${esc(n.industry)}</span><span class="chip">${esc(n.market)}</span>${n.lens?`<span class="chip lensc">${esc(t().lens)}</span>`:''}</span>`;
const card=n=>`<button class="card" data-open="${esc(n.id)}">${pic(n,640,360,false)}${metaLine(n)}<h3 class="hl">${esc(C(n,'title'))}</h3>${chips(n)}</button>`;
const rowi=n=>`<button class="rowi" data-open="${esc(n.id)}"><span style="min-width:0">${metaLine(n)}<h3 class="hl">${esc(C(n,'title'))}</h3>${chips(n)}</span>${pic(n,320,240,false)}</button>`;

  return h+`<div class="front">${wire}${main}${rail}</div>`;

function bindNews(root){
  root.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=root.querySelector(`.menu[data-for="${b.dataset.menu}"]`);const was=m.hidden;root.querySelectorAll('.menu').forEach(x=>x.hidden=true);m.hidden=!was});

const FINE=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
let peekT=null;

function showPeek(el){
  const n=S.items.find(x=>x.id===el.dataset.open);if(!n||S.view.story)return;const p=$('#peek');
  const kv=[[t().amount,n.type==='deal'?amt(n):null],[t().stage,n.stage],[t().investors,(n.investors||[]).slice(0,3).map(i=>i.name).join(', ')],[t().marketK,n.market]].filter(x=>x[1]);

/* ===== command palette ===== */
function index(){
  const out=[];const seen=new Set();const add=(k,label,act,sub)=>{const key=k+'|'+label;if(seen.has(key))return;seen.add(key);out.push({k,label,act,sub})};
  sorted().forEach(n=>{add('story',C(n,'title'),{story:n.id},srcName(n)+' · '+fmtShort(n.date));if(n.company)add('company',n.company,{ent:{k:'company',v:n.company}});(n.investors||[]).forEach(i=>add('investor',i.name,{ent:{k:'investor',v:i.name}}));add('source',srcName(n),{ent:{k:'source',v:srcName(n)}});(n.terms||[]).forEach(g=>add('term',g.t+' · '+g.ar,{story:n.id},g.def))});
  return out;
}
function openCmd(){
  if($('.cmdk'))return;hidePeek();const all=index();let sel=0;let res=all.slice(0,12);
  const o=document.createElement('div');o.className='cmdk';o.innerHTML=`<div class="box" role="dialog" aria-label="${esc(t().search)}"><input id="cq" placeholder="${esc(t().searchPh)}" autocomplete="off"><ul id="cr" role="listbox"></ul><div class="hint">${esc(t().searchHint)}</div></div>`;
  document.body.appendChild(o);const q=o.querySelector('#cq'),ul=o.querySelector('#cr');
  const kl=k=>k==='story'?t().stories:t().ent[k]||k;
  const draw=()=>{ul.innerHTML=res.map((r,i)=>`<li><button role="option" data-i="${i}" aria-selected="${i===sel}"><span class="k">${esc(kl(r.k))}</span><span style="min-width:0"><b style="font-weight:600">${esc(r.label)}</b>${r.sub?`<span class="meta" style="display:block">${esc(r.sub)}</span>`:''}</span></button></li>`).join('')||`<li class="empty" style="padding:20px">—</li>`;ul.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(+b.dataset.i))};
  const close=()=>o.remove();
  const pick=i=>{const r=res[i];if(!r)return;close();go(Object.assign({tab:'news'},r.act))};
  q.oninput=()=>{const s=q.value.trim().toLowerCase();res=(s?all.filter(r=>(r.label+' '+(r.sub||'')).toLowerCase().includes(s)):all).slice(0,14);sel=0;draw()};
  q.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(res.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter')pick(sel);else if(e.key==='Escape')close()};
  o.onclick=e=>{if(e.target===o)close()};draw();q.focus();
}
$('#cmdBtn').onclick=openCmd;
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'');if((e.key==='/'&&!/INPUT|TEXTAREA/.test(tag))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openCmd()}});

function wrapTerms(text,terms){let out=esc(text);(terms||[]).forEach((g,i)=>{const re=new RegExp('('+g.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');out=out.replace(re,`<button class="term" data-term="${i}">$1</button>`)});return out}

/* ===== selection: explain / translate / speak ===== */
let SEL=null;
function onSel(){
  const bar=$('#selbar');const s=window.getSelection();
  if(!s||s.isCollapsed||!s.rangeCount){bar.hidden=true;return}
  const txt=s.toString().trim();const r=s.getRangeAt(0);const node=r.commonAncestorContainer;const para=(node.nodeType===1?node:node.parentElement).closest('.para');
  if(!txt||!para||txt.length>600){bar.hidden=true;return}
  SEL={text:txt,i:+para.dataset.i};
  bar.querySelector('[data-a="explain"]').textContent=t().sel.explain;bar.querySelector('[data-a="translate"]').textContent=t().sel.translate;
  const rc=r.getBoundingClientRect();bar.hidden=false;
  const bw=bar.offsetWidth;let x=rc.left+rc.width/2-bw/2+window.scrollX;x=Math.max(8,Math.min(x,document.documentElement.clientWidth-bw-8));
  bar.style.left=x+'px';bar.style.top=(rc.bottom+window.scrollY+12)+'px';
}

    const ctx=`The story: "${n.en.title}" (${srcName(n)}, ${n.date}).\nFull story (English):\n${(n.en.body||[]).join('\n\n')}\n\nThe paragraph the reader is on:\n${para}\n\nThe part the reader selected: "${text}"`;
    const ask=a==='explain'
      ?`You explain a news story to a trainee investment analyst at a Saudi corporate VC fund. His English is weak. Write in simple Gulf Arabic, 3 to 5 short sentences, plain text only, no headings or bullets. Keep finance terms in English. Explain what the selected part means in this story and why it matters. Do not invent facts that are not in the story; general definitions are fine.\n\n${ctx}`
      :`Translate the selected text for a reader with weak English. If it is English, translate into Arabic; if Arabic, into English. Plain text only. Line 1: the meaning in this story's context. If it is one word or a short term, add line 2: how to pronounce it written in Arabic letters, and line 3: its general meaning if different. If it is a sentence, give a natural translation instead.\n\n${ctx}`;
    try{const r=await SAMPLE(ask,{modelTier:'quick',onText:({text})=>{p.textContent=text}});p.textContent=r.text}catch(err){p.innerHTML=fallback(a,n,i,text)}
    return;
  }
  addNote(i,a==='explain'?t().noteE:t().noteT,text,fallback(a,n,i,text));
});
function fallback(a,n,i,text){
  if(a==='explain')return `<b>${esc(t().paraFallback)}</b>\n${esc((n.explain||[])[i]||'')}`;
  const words=text.toLowerCase().replace(/[^a-z\- ]/g,' ').split(/\s+/).filter(Boolean);const v=n.vocab||{};
  const g=(n.terms||[]).find(x=>x.t.toLowerCase()===text.toLowerCase());if(g)return `<b>${esc(g.ar)}</b>\n${esc(g.def)}`;
  if(words.length&&words.length<=3){const hits=words.map(w=>v[w]?`${w} = ${v[w]}`:null).filter(Boolean);if(hits.length)return esc(hits.join('\n'))}
  return `<b>${esc(t().paraTrans)}</b>\n${esc(((n.ar||{}).body||[])[i]||'')}`;
}
function speak(text){if(!('speechSynthesis' in window)){toast(t().noSpeech);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=/[a-z]/i.test(text)?'en-US':'ar-SA';u.rate=.9;speechSynthesis.speak(u)}

/* ===== entity pages ===== */
function entItems(k,v){return sorted().filter(n=>k==='company'?n.company===v:k==='investor'?(n.investors||[]).some(i=>i.name===v):srcName(n)===v)}
function renderEntity(k,v){
  const list=entItems(k,v);const deals=list.filter(n=>n.type==='deal');const tot=deals.reduce((s,n)=>s+(n.amount||0),0);
  return `<section class="ent"><button class="back" id="back">${esc(t().back)}</button><div class="eyebrow">${esc(t().ent[k])}</div><h1 class="hl">${esc(v)}</h1><button class="fol" data-follow="${k}" data-v="${esc(v)}" aria-pressed="${isF(k,v)}">${esc(isF(k,v)?t().following:t().follow)}</button><div class="stats"><div><b>${list.length}</b><span>${esc(t().stories)}</span></div><div><b>${deals.length}</b><span>${esc(t().deals)}</span></div>${tot?`<div><b>${esc(money(tot))}</b><span>${esc(t().total)}</span></div>`:''}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${list.map(card).join('')}</div></section>`;
}

/* ===== render ===== */
function render(){
  renderTabs();const v=$('#view');
  if(!S.ready)return;
  let h='';
  if(S.view.story){const n=S.items.find(x=>x.id===S.view.story);h=n?renderStory(n):renderNews()}
  else if(S.view.ent)h=renderEntity(S.view.ent.k,S.view.ent.v);
  else if(S.view.tab==='news')h=renderNews();
  else{const s=t().soon[S.view.tab];h=`<div class="soon"><div class="eyebrow">The Morning Round</div><h2 class="hl">${esc(s[0])}</h2><p>${esc(s[1])}</p></div>`}
  v.innerHTML=h;fixImgs(v);
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.preventDefault();go({tab:'news',story:b.dataset.open})});
  v.querySelectorAll('[data-ent]').forEach(b=>b.onclick=e=>{e.preventDefault();go({tab:'news',ent:{k:b.dataset.ent,v:b.dataset.v}})});
  v.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>toggleF(b.dataset.follow,b.dataset.v));
  v.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.f={type:'',industry:'',market:'',inv:''};S.f[b.dataset.filter]=b.dataset.v;saveFilters();go({tab:'news'},true)});
  if(S.view.story){const n=S.items.find(x=>x.id===S.view.story);if(n)bindStory(v,n)}
  else if(S.view.ent)v.querySelector('#back').onclick=goBack;
  else if(S.view.tab==='news')bindNews(v);
}
renderMast();setLang(L);
</script>
