name: Find logos (checked pass)
on:
  push:
    paths: ['tools/logos3.json', 'tools/fetch_logos3.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: logos3
  cancel-in-progress: false
jobs:
  logos3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow cairosvg
      - run: python3 tools/fetch_logos3.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add img/logo3
          git diff --cached --quiet || (git commit -m "Find logos (checked pass)" && git pull --rebase && git push)
