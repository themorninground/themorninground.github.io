name: Build logo pack
on:
  push:
    paths: ['tools/logo_pack.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install fonttools uharfbuzz brotli
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: python3 tools/logo_pack.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add brand/pack brand/fonts
          git diff --cached --quiet || (git commit -m "Build logo pack" && git pull --rebase && git push)
