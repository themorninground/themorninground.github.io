name: Find logos (second pass)
on:
  push:
    paths: ['tools/logos2.json', 'tools/fetch_logos2.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 tools/fetch_logos2.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add img/logo2
          git diff --cached --quiet || (git commit -m "Find logos (second pass)" && git pull --rebase && git push)
