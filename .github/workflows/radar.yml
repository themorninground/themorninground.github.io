name: Radar (collect headlines)
on:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths: ['tools/collect.py', 'tools/sources.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/collect.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add data/radar.json tools/feeds.json tools/sources.json
          git diff --cached --quiet || (git commit -m "Radar: new headlines" && git pull --rebase && git push)
