name: Mirror news images
on:
  push:
    paths: ['tools/images.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: images
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 tools/fetch_images.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add img
          git diff --cached --quiet || (git commit -m "Mirror news images" && git pull --rebase && git push)
