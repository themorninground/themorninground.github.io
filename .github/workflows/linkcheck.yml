name: Check reference links
on:
  push:
    paths: ['tools/links.txt', 'tools/linkcheck.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/linkcheck.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add tools/links.json
          git diff --cached --quiet || (git commit -m "Reference link check" && git pull --rebase && git push)
