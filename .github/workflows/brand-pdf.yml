name: Brand guide PDF
on:
  push:
    paths: ['brand/drafts/guide-print.html', 'tools/pdf.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/pdf.mjs
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add brand/drafts/*.pdf
          git diff --cached --quiet || (git commit -m "Brand guide PDF" && git pull --rebase && git push)
