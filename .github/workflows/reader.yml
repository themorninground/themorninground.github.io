name: Read story pages (for fact checks)
on:
  push:
    paths: ['tools/read.json', 'tools/reader.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install cryptography
      - run: python3 tools/reader.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add data/read
          git diff --cached --quiet || (git commit -m "Read story pages" && git pull --rebase && git push)
