name: Mirror logos
on:
  push:
    paths: ['tools/logos.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 tools/fetch_logos.py
      - run: |
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add img/logo
          git diff --cached --quiet || (git commit -m "Mirror logos" && git pull --rebase && git push)
