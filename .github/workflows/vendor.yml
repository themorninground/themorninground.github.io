name: Vendor chart libraries
on:
  push:
    paths: ['.github/workflows/vendor.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p vendor
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js -o vendor/d3.min.js
          curl -sSfL https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js -o vendor/d3-sankey.min.js
          curl -sSfL https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json -o vendor/countries-50m.json
          curl -sSfL https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js -o vendor/topojson-client.min.js
          git config user.name "The Morning Round"
          git config user.email "themorninground@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet || (git commit -m "Vendor chart libraries and map data" && git push)
