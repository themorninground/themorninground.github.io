<script>
/* Public-site data adapter.
   Gives src/paper.html the same window.claude.use('db') interface it uses inside Claude,
   but reads shared content from data/site.json and keeps each visitor's own progress
   (done, saved, follows, streak, lab values, terms) in their browser only. */
(function(){
  document.documentElement.classList.add('public');
  var KEY='mr-public-v1', L={};
  try{L=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){L={}}
  L.p=L.p||{};L.s=L.s||{};L.d=L.d||{};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
  var BASE=null, subs=[];
  function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
  function merge(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=isObj(b[k])&&isObj(a[k])?merge(a[k],b[k]):b[k];return o}
  function baseCol(c){return (BASE&&BASE.collections&&BASE.collections[c])||{}}
  function docOf(path){
    if(L.d[path])return null;
    var i=path.indexOf('/'),c=path.slice(0,i),id=path.slice(i+1);
    var base=L.s[path]?null:baseCol(c)[id],p=L.p[path];
    if(!base&&!p)return null;
    return merge(base||{},p||{});
  }
  function docsOf(c){
    var ids={},k;for(k in baseCol(c))ids[k]=1;
    for(k in L.p)if(k.indexOf(c+'/')===0)ids[k.slice(c.length+1)]=1;
    var out=[];for(k in ids){var d=docOf(c+'/'+k);if(d)out.push({id:k,d:d})}
    return out;
  }
  function emit(){subs.forEach(function(f){try{f()}catch(e){}})}
  function ref(path){return{
    get:function(){var d=docOf(path);return Promise.resolve({exists:!!d,data:function(){return d}})},
    set:function(v){delete L.d[path];L.s[path]=true;L.p[path]=v;save();emit();return Promise.resolve()},
    update:function(v){L.p[path]=merge(L.p[path]||{},v);save();emit();return Promise.resolve()},
    delete:function(){L.d[path]=true;delete L.p[path];delete L.s[path];save();emit();return Promise.resolve()},
    onSnapshot:function(cb){var f=function(){if(!BASE)return;var d=docOf(path);cb({exists:!!d,data:function(){return d}})};subs.push(f);f();return function(){}}
  }}
  var db={doc:ref,collection:function(c){return{
    doc:function(id){return ref(c+'/'+id)},
    onSnapshot:function(cb){var f=function(){if(!BASE)return;cb({docs:docsOf(c).map(function(x){return{id:x.id,data:function(){return x.d}}})})};subs.push(f);f();return function(){}}
  }}};
  fetch('data/site.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){BASE=j;emit()}).catch(function(){BASE={collections:{}};emit()});
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:null)}};
})();
</script>

<style>
/* Layout: The Morning Round's own identity (MR seal, Bodoni wordmark, navy × beige, six accents) spread across a desk-wide newsroom: black strip, sticky bar with menu and settings, ticker, five tabs. Wide screens get three columns; phones get one. */
:root{
  --paper:#F2EADC; --paper-2:#E8DECC; --ink:#14233D; --ink-2:#4A5874; --hair:#D9CDB8; --rule:#14233D;
  --bar:#0B1424; --bar-ink:#F2EADC; --art-bg:#14233D; --art-fg:#EDE3D1; --pop:#6FA8FF;
  --soft:#E5DBC8; --miss:#8E2F2F;
  --head:'Archivo',system-ui,sans-serif; --display:'Bodoni Moda',Didot,Georgia,serif; --ar:'IBM Plex Sans Arabic','Geeza Pro',sans-serif;
  --fs:16px; --sp:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1726;--paper-2:#16233A;--ink:#EDE3D1;--ink-2:#B9AF9C;--hair:#26344D;--rule:#EDE3D1;--bar:#070D18;--bar-ink:#EDE3D1;--art-bg:#1B2C4D;--art-fg:#EDE3D1;--pop:#8DBBFF;--soft:#1B2840;--miss:#E5A09A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1726;--paper-2:#16233A;--ink:#EDE3D1;--ink-2:#B9AF9C;--hair:#26344D;--rule:#EDE3D1;--bar:#070D18;--bar-ink:#EDE3D1;--art-bg:#1B2C4D;--art-fg:#EDE3D1;--pop:#8DBBFF;--soft:#1B2840;--miss:#E5A09A;color-scheme:dark}
:root[data-accent="ink"]{--ink:#141414;--ink-2:#5A544A;--rule:#141414;--bar:#0A0A0A;--art-bg:#141414;--pop:#FF5A3C}
:root[data-accent="claret"]{--ink:#5E1A24;--ink-2:#7A5058;--rule:#5E1A24;--bar:#2A0B10;--art-bg:#5E1A24;--pop:#FF8FA3}
:root[data-accent="brown"]{--ink:#3B2414;--ink-2:#6E5848;--rule:#3B2414;--bar:#1E120A;--art-bg:#3B2414;--pop:#F0B36B}
:root[data-accent="olive"]{--ink:#2F3517;--ink-2:#5B5F45;--rule:#2F3517;--bar:#151809;--art-bg:#2F3517;--pop:#C6D86B}
:root[data-accent="rose"]{--ink:#A93E64;--ink-2:#7E5A64;--rule:#A93E64;--bar:#4A1A2C;--art-bg:#A93E64;--pop:#FFE0EA;--soft:#F1DCD9}
@media (prefers-color-scheme: dark){
  :root[data-accent="ink"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#111111;--paper-2:#1D1B18;--hair:#2E2B26;--bar:#000;--art-bg:#26231F;--pop:#FF6B4F;--soft:#26231F}
  :root[data-accent="claret"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1E0D11;--paper-2:#2B1519;--hair:#3D2228;--bar:#12070A;--art-bg:#3A1A21;--pop:#FF9EB0;--soft:#2B1519}
  :root[data-accent="brown"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1A120C;--paper-2:#261B13;--hair:#3A2C21;--bar:#0F0A06;--art-bg:#352517;--pop:#F2BD7E;--soft:#261B13}
  :root[data-accent="olive"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#12150B;--paper-2:#1C2013;--hair:#2E3322;--bar:#0A0C06;--art-bg:#2A301A;--pop:#D2E27E;--soft:#1C2013}
  :root[data-accent="rose"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#2A1820;--paper-2:#38212B;--hair:#4A2E3A;--bar:#1A0E14;--art-bg:#4A2433;--pop:#FFB8CC;--soft:#38212B}}
:root[data-theme="dark"][data-accent="ink"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#111111;--paper-2:#1D1B18;--hair:#2E2B26;--bar:#000;--art-bg:#26231F;--pop:#FF6B4F;--soft:#26231F}
:root[data-theme="dark"][data-accent="claret"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1E0D11;--paper-2:#2B1519;--hair:#3D2228;--bar:#12070A;--art-bg:#3A1A21;--pop:#FF9EB0;--soft:#2B1519}
:root[data-theme="dark"][data-accent="brown"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1A120C;--paper-2:#261B13;--hair:#3A2C21;--bar:#0F0A06;--art-bg:#352517;--pop:#F2BD7E;--soft:#261B13}
:root[data-theme="dark"][data-accent="olive"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#12150B;--paper-2:#1C2013;--hair:#2E3322;--bar:#0A0C06;--art-bg:#2A301A;--pop:#D2E27E;--soft:#1C2013}
:root[data-theme="dark"][data-accent="rose"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#2A1820;--paper-2:#38212B;--hair:#4A2E3A;--bar:#1A0E14;--art-bg:#4A2433;--pop:#FFB8CC;--soft:#38212B}

:root{--sheet:color-mix(in srgb,var(--paper) 55%,#fff);--lens:#8A5A12;--lens-bg:#F4E6CC;--up:#1E7A46;--down:#B23B2E;--new:#D9512C;--r:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sheet:color-mix(in srgb,var(--paper-2) 70%,var(--paper));--lens:#F1C886;--lens-bg:#2A2214;--up:#6FD39A;--down:#FF8E80;--new:#FF8455}}
:root[data-theme="dark"]{--sheet:color-mix(in srgb,var(--paper-2) 70%,var(--paper));--lens:#F1C886;--lens-bg:#2A2214;--up:#6FD39A;--down:#FF8E80;--new:#FF8455}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--head);font-size:var(--fs);line-height:1.55;padding-block:0;padding-inline:0}
html[lang="ar"] body{font-family:var(--ar)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}}
.tnum{font-variant-numeric:tabular-nums}
.en{font-family:var(--head);direction:ltr;unicode-bidi:isolate;text-align:left}
.arx{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;text-align:right}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
html[lang="ar"] .lbl{letter-spacing:0;font-size:.82rem}
.hl{font-family:var(--head);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
html[lang="ar"] .hl{font-family:var(--ar);font-weight:700;letter-spacing:0}
.muted{color:var(--ink-2)}

/* strip + bar */
.strip{background:var(--bar);color:var(--bar-ink);font-size:.76rem;border-bottom:1px solid rgba(255,255,255,.07)}
.strip .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:32px;direction:ltr}
.strip .r{display:flex;gap:14px;align-items:center}
.strip i{font-family:var(--display)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.bar{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:60px}
.bar .side{display:flex;align-items:center;gap:6px;min-width:0}
.bar .side.end{justify-content:flex-end}
.iconbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--bar-ink);border-radius:8px;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--bar-ink);padding:0;direction:ltr;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand .wm{font-family:var(--display);font-weight:800;font-size:1.35rem;white-space:nowrap}
.langs{display:inline-flex;border:1px solid rgba(242,234,220,.3);border-radius:999px;overflow:hidden;flex:none}
.langs button{background:none;border:0;color:var(--bar-ink);padding:5px 11px;font-size:.8rem;min-height:34px}
.langs button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.searchbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(242,234,220,.3);background:none;color:var(--bar-ink);border-radius:999px;padding:5px 12px;font-size:.8rem;min-height:34px}
.searchbtn kbd{font-family:var(--head);font-size:.7rem;opacity:.7;border:1px solid rgba(242,234,220,.3);border-radius:4px;padding:0 4px}
.tabs{border-top:1px solid rgba(255,255,255,.08)}
.tabs .wrap{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:rgba(242,234,220,.68);padding:11px 0 9px;font-weight:600;font-size:.95rem;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--bar-ink)}
.tab[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--pop)}
@media (max-width:860px){.bar .top{grid-template-columns:auto 1fr auto;min-height:54px}.brand .wm{font-size:1.1rem}.brand svg{width:28px;height:28px}.searchbtn .t,.searchbtn kbd{display:none}.searchbtn{padding:0;width:38px;justify-content:center}.tabs .wrap{justify-content:flex-start;gap:20px}}
@media (max-width:480px){.searchbtn{display:none!important}.brand .wm{font-size:1rem}.brand svg{width:26px;height:26px}.langs button{padding:5px 8px}.bar .top{gap:6px}}

/* settings sheet */
.sheetp{background:var(--paper-2);border-bottom:1px solid var(--hair)}
.sheetp .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding-block:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--hair);background:var(--paper);font-size:.84rem;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.5)}

/* menu */
.menuov{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto}
.menuov .wrap{padding-block:18px 40px}
.menuov .mh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:18px}
.menuov .mh .brand{color:var(--ink)}
.menuov .close{width:44px;height:44px;border:1px solid var(--hair);background:none;border-radius:50%;font-size:1.3rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
.mgrid h4{margin:0 0 8px;border-top:3px solid var(--ink);padding-top:8px}
.mgrid button{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--hair);padding:10px 0;text-align:start;font-weight:600}
.mgrid button small{display:block;font-weight:400;color:var(--ink-2);font-size:.8rem}
.mgrid button:hover{color:var(--pop)}

/* ticker */
.ticker{background:var(--paper-2);border-bottom:1px solid var(--hair);overflow:hidden;direction:ltr}
.track{display:flex;gap:10px;padding:10px 0;width:max-content;animation:tick 60s linear infinite}
.ticker:hover .track,.ticker:focus-within .track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
.tcard{background:var(--bar);color:var(--bar-ink);border-radius:6px;padding:7px 12px;min-width:150px;display:flex;flex-direction:column;gap:1px;text-decoration:none}
.tcard .l{font-size:.74rem;font-weight:600;opacity:.85;white-space:nowrap}
.tcard .v{font-size:.98rem;font-weight:700;white-space:nowrap}
.dir-up{color:#5FD39A}.dir-down{color:#FF7B70}.dir-flat{opacity:.75}
.tsrc{font-size:.72rem;color:var(--ink-2);padding-block:5px;text-align:end;direction:ltr}

/* masthead on front */
.mast{text-align:center;padding-top:calc(20px*var(--sp));direction:ltr}
.mast .the{font-family:var(--display);font-style:italic;font-size:1.05rem}
.mast h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,64px);letter-spacing:.06em;line-height:1}
.mast .tag{display:flex;align-items:center;gap:12px;margin-top:8px}
.mast .tag span{flex:1;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);height:3px;opacity:.5}
.mast .tag i{font-family:var(--display);font-size:.98rem}
.mast .dl{font-size:.78rem;color:var(--ink-2);margin-top:8px;display:flex;justify-content:space-between;border-bottom:3px double var(--rule);padding-bottom:8px;gap:10px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:3px double var(--rule);padding-block:22px 10px;margin-bottom:16px}
.secthead h1{margin:0;font-family:var(--display);font-size:clamp(28px,4vw,46px);font-weight:800}
html[lang="ar"] .secthead h1{font-family:var(--ar);font-weight:700}
.secthead p{margin:0;color:var(--ink-2);font-size:.9rem;max-width:520px}

/* tools / filters */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px;border-bottom:1px solid var(--hair);margin-bottom:22px}
.fsel{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:.86rem;min-height:38px}
.fbtn:hover{border-color:var(--ink-2)}
.fbtn[data-on="1"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fbtn .k{opacity:.65;font-size:.82em}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:25;background:var(--sheet);border:1px solid var(--hair);border-radius:10px;padding:6px;min-width:220px;box-shadow:0 16px 40px rgba(0,0,0,.16);max-height:340px;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:8px 10px;border-radius:6px;text-align:start;font-size:.9rem}
.menu button:hover,.menu button[aria-pressed="true"]{background:var(--soft)}
.menu .n{color:var(--ink-2);font-size:.78em}
.invq{border:1px solid var(--hair);background:var(--sheet);border-radius:999px;padding:6px 13px;min-height:38px;font-size:.86rem;width:190px;max-width:100%}
.layoutseg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;margin-inline-start:auto;background:var(--sheet)}
.layoutseg button{border:0;background:none;padding:6px 12px;font-size:.82rem;min-height:36px;color:var(--ink-2)}
.layoutseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.followf{border:1px solid var(--pop);color:var(--ink);background:none;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;min-height:38px}
.followf[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:.8rem;color:var(--ink-2)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px;font-weight:inherit;text-align:inherit}
.linkish:hover{text-decoration-color:currentColor}

/* front grid */
.front{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:32px;align-items:start}
.colhead{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--rule);padding-top:8px;margin-bottom:10px}
.colhead h3{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] .colhead h3{letter-spacing:0;font-size:.92rem}
.colhead span{font-size:.75rem;color:var(--ink-2)}
.wire{position:sticky;top:130px}
.wire ol{list-style:none;margin:0;padding:0}
.wire li{border-bottom:1px solid var(--hair)}
.wire button{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;width:100%;background:none;border:0;padding:10px 0;text-align:start}
.wire .tm{font-size:.74rem;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums;font-weight:600}
.wire .tt{font-size:.9rem;line-height:1.38;font-weight:600}
.wire button:hover .tt{text-decoration:underline}
.wire .sm{display:block;font-size:.72rem;color:var(--ink-2);margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new);margin-inline-end:6px;vertical-align:middle}
.newtag{font-size:.66rem;font-weight:800;color:var(--new);letter-spacing:.06em}
.lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;color:inherit;padding-bottom:22px;border-bottom:1px solid var(--hair);margin-bottom:22px;background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.lead .pic{aspect-ratio:4/3}
.lead h2{font-size:clamp(1.45rem,2.2vw,2.05rem);line-height:1.2;margin:8px 0 10px}

const FINE=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
let peekT=null;

function showPeek(el){
  const n=S.items.find(x=>x.id===el.dataset.open);if(!n||S.view.story)return;const p=$('#peek');
  const kv=[[t().amount,n.type==='deal'?amt(n):null],[t().stage,n.stage?stageL(n.stage):null],[t().investors,(n.investors||[]).slice(0,3).map(i=>i.name).join(', ')],[t().marketK,n.market?mktL(n.market):null]].filter(x=>x[1]);

  const r=el.getBoundingClientRect();const pw=340;const vw=document.documentElement.clientWidth;
  let x=r.right+14;if(x+pw>vw-12)x=r.left-pw-14;if(x<12)x=Math.min(vw-pw-12,r.left);

/* ===== search ===== */
function allTerms(){const m=new Map();S.items.forEach(n=>(n.terms||[]).forEach(g=>{if(!m.has(g.t.toLowerCase()))m.set(g.t.toLowerCase(),{t:g.t,ar:g.ar,def:g.def,from:n.id})}));(me().terms||[]).forEach(g=>{if(!m.has(String(g.t).toLowerCase()))m.set(String(g.t).toLowerCase(),g)});return [...m.values()].sort((a,b)=>a.t.localeCompare(b.t))}
function index(){
  const out=[];const seen=new Set();const add=(k,label,act,sub)=>{const key=k+'|'+label;if(!label||seen.has(key))return;seen.add(key);out.push({k,label,act,sub})};
  sorted().forEach(n=>{add('story',C(n,'title'),{story:n.id},typeL(n)+' · '+srcName(n));if(n.company)add('company',n.company,{ent:{k:'company',v:n.company}});(n.investors||[]).forEach(i=>add('investor',i.name,{ent:{k:'investor',v:i.name}}));add('source',srcName(n),{ent:{k:'source',v:srcName(n)}})});
  Object.values(S.profiles||{}).forEach(p=>add(p.kind,p.name,{ent:{k:p.kind,v:p.name}},p.kind==='company'?indL(p.industry||''):(p.type&&(p.type[L]||p.type.en))));
  (S.concepts||[]).forEach(c=>add('concept',c.name[L]||c.name.en,{tab:'foryou',concept:c.id},c.short[L]||c.short.en));
  allTerms().forEach(g=>add('term',g.t+(g.ar?' · '+g.ar:''),g.from?{story:g.from}:{tab:'foryou'},g.def));
  return out;
}
function openCmd(){
  if($('.cmdk'))return;hidePeek();const all=index();let sel=0;let res=all.slice(0,12);
  const o=document.createElement('div');o.className='cmdk';o.innerHTML=`<div class="box" role="dialog" aria-label="${esc(t().search)}"><input id="cq" placeholder="${esc(t().searchPh)}" autocomplete="off"><ul id="cr" role="listbox"></ul><div class="hint">${esc(t().searchHint)}</div></div>`;
  document.body.appendChild(o);const q=o.querySelector('#cq'),ul=o.querySelector('#cr');
  const kl=k=>t().ent[k]||k;
  const draw=()=>{ul.innerHTML=res.map((r,i)=>`<li><button role="option" data-i="${i}" aria-selected="${i===sel}"><span class="k">${esc(kl(r.k))}</span><span style="min-width:0"><b style="font-weight:700">${esc(r.label)}</b>${r.sub?`<span class="meta" style="display:block">${esc(String(r.sub).slice(0,110))}</span>`:''}</span></button></li>`).join('')||`<li class="empty" style="padding:20px">—</li>`;ul.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(+b.dataset.i))};
  const close=()=>o.remove();
  const pick=i=>{const r=res[i];if(!r)return;close();go(Object.assign({tab:'news'},r.act),!!r.act.tab&&!r.act.concept)};
  q.oninput=()=>{const s=q.value.trim().toLowerCase();res=(s?all.filter(r=>(r.label+' '+(r.sub||'')).toLowerCase().includes(s)):all).slice(0,14);sel=0;draw()};
  q.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(res.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter')pick(sel);else if(e.key==='Escape')close()};
  o.onclick=e=>{if(e.target===o)close()};draw();q.focus();

$('#cmdBtn').onclick=openCmd;
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'');if((e.key==='/'&&!/INPUT|TEXTAREA/.test(tag))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openCmd()}});

function entList(){const s=new Set();Object.values(S.profiles||{}).forEach(p=>s.add(p.kind+'|'+p.name));allDeals().forEach(x=>{s.add('company|'+x.company);(x.investors||[]).forEach(i=>{if(!/angel/i.test(i.name))s.add('investor|'+i.name)})});return [...s].map(z=>{const [k,...v]=z.split('|');return{k,v:v.join('|')}}).sort((a,b)=>a.v.localeCompare(b.v))}
function entStats(e){const p=profFor(e.v);if(e.k==='company'){const rs=roundsOf(e.v,p);const vs=valsOf(e.v);const inv=d3.rollups(rs.flatMap(r=>(r.lead||[]).concat(r.inv||[])),v=>v.length,z=>z).sort((a,b)=>b[1]-a[1]).slice(0,4).map(z=>z[0]);return{p,raised:d3.sum(rs,r=>r.amount||0),n:rs.length,last:rs[rs.length-1],val:vs[vs.length-1],inv,ind:p?p.industry:(allDeals().find(x=>x.company===e.v)||{}).industry}}const ds=allDeals().filter(x=>(x.investors||[]).some(i=>i.name===e.v));return{p,raised:d3.sum(ds,x=>x.amount||0),n:ds.length,lead:ds.filter(x=>x.investors.some(i=>i.name===e.v&&i.lead)).length,sec:d3.rollups(ds,v=>v.length,x=>x.industry).sort((a,b)=>b[1]-a[1]).slice(0,3),cos:ds.map(x=>x.company)}}
function renderCompare(){const x=xt();const L2=entList();const a=S.view.a||'company|Tabby',b=S.view.b||'company|Barq';const pa=a.split('|'),pb=b.split('|');const A={k:pa[0],v:pa.slice(1).join('|')},B={k:pb[0],v:pb.slice(1).join('|')};
  const sel=(id,cur)=>`<select id="${id}">${['company','investor'].map(k=>`<optgroup label="${esc(t().ent[k])}">${L2.filter(e=>e.k===k).map(e=>`<option value="${esc(e.k+'|'+e.v)}" ${e.k+'|'+e.v===cur?'selected':''}>${esc(e.v)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  const col=e=>{const s=entStats(e);const p=s.p;return `<div class="cmpcol">${logo(e.v,64)}<h2 class="hl">${esc(e.v)}</h2><div class="lbl">${esc(t().ent[e.k])}${p&&p.portfolio?' · '+esc(ft().portfolio):''}</div>${p?`<p class="${L==='ar'?'arx':'en'}">${esc(tx({en:p.en,ar:p.ar}))}</p>`:''}<div class="kvg">${e.k==='company'?`<div><span>${esc(ft().sector)}</span><b>${esc(indL(s.ind||''))}</b></div><div><span>${esc(ft().founded)}</span><b>${p&&p.founded||'—'}</b></div><div><span>${esc(x.raised)}</span><b>${esc(s.raised?money(s.raised):'—')}</b></div><div><span>${esc(x.rounds)}</span><b>${s.n}</b></div><div><span>${esc(x.lastR)}</span><b>${s.last?esc((s.last.stage||'')+' · '+(s.last.label||fmtShort(s.last.date))):'—'}</b></div><div><span>${esc(x.lastV)}</span><b>${s.val?esc(money(s.val.post)):'—'}</b></div>`:`<div><span>${esc(ft().type)}</span><b>${p?esc(tx(p.type)):'—'}</b></div><div><span>${esc(x.dealsN)}</span><b>${s.n}</b></div><div><span>${esc(ft().leads)}</span><b>${s.lead}</b></div><div><span>${esc(x.raised)}</span><b>${esc(s.raised?money(s.raised):'—')}</b></div>`}</div>${e.k==='company'&&s.inv.length?`<div class="lbl">${esc(x.topInv)}</div><div class="pl">${s.inv.map(n=>logo(n,30)).join('')}</div>`:''}${e.k==='investor'?`<div class="lbl">${esc(x.topSec)}</div><p>${s.sec.map(([k,c])=>esc(indL(k))+' ('+c+')').join(' · ')||'—'}</p><div class="pl">${[...new Set(s.cos)].slice(0,10).map(c=>logo(c,30)).join('')}</div>`:''}<button class="linkish" data-ent="${e.k}" data-v="${esc(e.v)}">${esc(ft().openProfile)} ←</button></div>`};
  return `<p class="muted">${esc(x.cmpPick)}</p><div class="cmpsel">${sel('cA',A.k+'|'+A.v)}<span>vs</span>${sel('cB',B.k+'|'+B.v)}</div><div class="cmp2">${col(A)}${col(B)}</div><div id="cmpTl" class="rtl"></div>`}
function bindCompare(root){['cA','cB'].forEach(id=>{const s=root.querySelector('#'+id);if(s)s.onchange=()=>{S.view=Object.assign({},S.view,{[id==='cA'?'a':'b']:s.value});render()}});
  const el=root.querySelector('#cmpTl');if(!el)return;const vals=[root.querySelector('#cA').value,root.querySelector('#cB').value].map(z=>{const p=z.split('|');return{k:p[0],v:p.slice(1).join('|')}});if(vals.some(e=>e.k!=='company')){el.remove();return}
  const rs=vals.map((e,i)=>roundsOf(e.v,profFor(e.v)).map(r=>({...r,i,co:e.v}))).flat();if(!rs.length){el.remove();return}const W=el.clientWidth||800,H=170,m={l:20,r:20,t:30,b:26};const svg=svgIn(el,W,H);const pt=d3.timeParse('%Y-%m-%d');const ext=d3.extent(rs,r=>pt(r.date));const x=d3.scaleTime([d3.timeMonth.offset(ext[0],-4),d3.timeMonth.offset(ext[1],4)],[m.l,W-m.r]);const r=d3.scaleSqrt([0,d3.max(rs,q=>q.amount||0)||1],[5,30]);const cc=['#4C8DF6','#E2A04A'];
  svg.append('g').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(6).tickFormat(d3.timeFormat('%Y'))).call(g=>{g.select('.domain').attr('stroke',hairc());g.selectAll('text').attr('fill',ink2())});
  [0,1].forEach(i=>svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',55+i*55).attr('y2',55+i*55).attr('stroke',cc[i]).attr('opacity',.3).attr('stroke-width',2));
  const g=svg.append('g').selectAll('g').data(rs).join('g').attr('transform',q=>`translate(${x(pt(q.date))},${55+q.i*55})`);g.append('circle').attr('r',q=>q.amount?r(q.amount):5).attr('fill',q=>cc[q.i]).attr('opacity',.85);g.append('text').attr('y',q=>-(q.amount?r(q.amount):5)-4).attr('text-anchor','middle').attr('font-size',10).attr('font-weight',800).attr('fill',ink()).text(q=>q.amount?money(q.amount):'');g.on('mousemove',(ev,q)=>gtip(ev,`<b>${esc(q.co)}</b> · ${esc(q.stage||'')}<br>${esc(q.amount!=null?money(q.amount):t().undisclosed)} · ${esc(q.label||fmtDate(q.date))}`)).on('mouseleave',gtipOff)}
/* library */
function renderLibrary(){const x=xt();const lib=S.library||[];const K={podcast:'🎙️',youtube:'▶️',book:'📚',x:'𝕏',site:'🔗'};return `<p class="muted" style="max-width:720px;line-height:1.8">${esc(x.libIntro)}</p>${Object.keys(x.lib).map(k=>{const xs=lib.filter(z=>z.k===k);if(!xs.length)return '';return `<div class="cgroup"><div class="colhead"><h3>${K[k]} ${esc(x.lib[k])}</h3><span>${xs.length}</span></div><div class="libgrid">${xs.map(z=>`<a class="libcard" href="${esc(safeUrl(z.url))}" target="_blank" rel="noopener">${logo(logoUrl(z.t)?z.t:(z.who||z.t),44)}<span><b>${esc(z.t)}</b><small>${esc(z.who||'')}${z.lang==='ar'?' · عربي':''}</small><em class="${L==='ar'?'arx':'en'}">${esc(z[L]||z.en)}</em></span><i>${esc(x.open)}</i></a>`).join('')}</div></div>`}).join('')}`}

applySettings();renderMast();setLang(L);
