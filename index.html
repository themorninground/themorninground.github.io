<script>
/* Public-site data adapter.
   Gives src/paper.html the same window.claude.use('db') interface it uses inside Claude,
   but reads shared content from data/site.json and keeps each visitor's own progress
   (done, saved, follows, streak, lab values, terms) in their browser only. */
(function(){
  document.documentElement.classList.add('public');
  var KEY='mr-public-v1', L={};
  try{L=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){L={}}
  L.p=L.p||{};L.s=L.s||{};L.d=L.d||{};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
  var BASE=null, subs=[];
  function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
  function merge(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=isObj(b[k])&&isObj(a[k])?merge(a[k],b[k]):b[k];return o}
  function baseCol(c){return (BASE&&BASE.collections&&BASE.collections[c])||{}}
  function docOf(path){
    if(L.d[path])return null;
    var i=path.indexOf('/'),c=path.slice(0,i),id=path.slice(i+1);
    var base=L.s[path]?null:baseCol(c)[id],p=L.p[path];
    if(!base&&!p)return null;
    return merge(base||{},p||{});
  }
  function docsOf(c){
    var ids={},k;for(k in baseCol(c))ids[k]=1;
    for(k in L.p)if(k.indexOf(c+'/')===0)ids[k.slice(c.length+1)]=1;
    var out=[];for(k in ids){var d=docOf(c+'/'+k);if(d)out.push({id:k,d:d})}
    return out;
  }
  function emit(){subs.forEach(function(f){try{f()}catch(e){}})}
  function ref(path){return{
    get:function(){var d=docOf(path);return Promise.resolve({exists:!!d,data:function(){return d}})},
    set:function(v){delete L.d[path];L.s[path]=true;L.p[path]=v;save();emit();return Promise.resolve()},
    update:function(v){L.p[path]=merge(L.p[path]||{},v);save();emit();return Promise.resolve()},
    delete:function(){L.d[path]=true;delete L.p[path];delete L.s[path];save();emit();return Promise.resolve()},
    onSnapshot:function(cb){var f=function(){if(!BASE)return;var d=docOf(path);cb({exists:!!d,data:function(){return d}})};subs.push(f);f();return function(){}}
  }}
  var db={doc:ref,collection:function(c){return{
    doc:function(id){return ref(c+'/'+id)},
    onSnapshot:function(cb){var f=function(){if(!BASE)return;cb({docs:docsOf(c).map(function(x){return{id:x.id,data:function(){return x.d}}})})};subs.push(f);f();return function(){}}
  }}};
  fetch('data/site.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){BASE=j;emit()}).catch(function(){BASE={collections:{}};emit()});
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:null)}};
})();
</script>

/* Layout: a mobile-first news app in the Bloomberg/Asharq mould — black top strip, deal ticker, section tabs with sub-category rails, lead story with generated cover art, horizontal story rails, ranked lists; identity tokens below (navy × beige default) */
:root{
  --paper:#F2EADC; --paper-2:#E8DECC; --ink:#14233D; --ink-2:#4A5874; --hair:#D9CDB8; --rule:#14233D;
  --bar:#0B1424; --bar-ink:#F2EADC; --art-bg:#14233D; --art-fg:#EDE3D1; --pop:#6FA8FF;
  --soft:#E5DBC8; --miss:#8E2F2F;
  --head:'Archivo',system-ui,sans-serif; --display:'Bodoni Moda',Didot,Georgia,serif; --ar:'IBM Plex Sans Arabic','Geeza Pro',sans-serif;
  --fs:16px; --sp:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1726;--paper-2:#16233A;--ink:#EDE3D1;--ink-2:#B9AF9C;--hair:#26344D;--rule:#EDE3D1;--bar:#070D18;--bar-ink:#EDE3D1;--art-bg:#1B2C4D;--art-fg:#EDE3D1;--pop:#8DBBFF;--soft:#1B2840;--miss:#E5A09A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1726;--paper-2:#16233A;--ink:#EDE3D1;--ink-2:#B9AF9C;--hair:#26344D;--rule:#EDE3D1;--bar:#070D18;--bar-ink:#EDE3D1;--art-bg:#1B2C4D;--art-fg:#EDE3D1;--pop:#8DBBFF;--soft:#1B2840;--miss:#E5A09A;color-scheme:dark}
:root[data-accent="ink"]{--ink:#141414;--ink-2:#5A544A;--rule:#141414;--bar:#0A0A0A;--art-bg:#141414;--pop:#FF5A3C}
:root[data-accent="claret"]{--ink:#5E1A24;--ink-2:#7A5058;--rule:#5E1A24;--bar:#2A0B10;--art-bg:#5E1A24;--pop:#FF8FA3}
:root[data-accent="brown"]{--ink:#3B2414;--ink-2:#6E5848;--rule:#3B2414;--bar:#1E120A;--art-bg:#3B2414;--pop:#F0B36B}
:root[data-accent="olive"]{--ink:#2F3517;--ink-2:#5B5F45;--rule:#2F3517;--bar:#151809;--art-bg:#2F3517;--pop:#C6D86B}
:root[data-accent="rose"]{--ink:#A93E64;--ink-2:#7E5A64;--rule:#A93E64;--bar:#4A1A2C;--art-bg:#A93E64;--pop:#FFE0EA;--soft:#F1DCD9}
@media (prefers-color-scheme: dark){

  :root[data-accent="claret"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1E0D11;--paper-2:#2B1519;--hair:#3D2228;--bar:#12070A;--art-bg:#3A1A21;--pop:#FF9EB0;--soft:#2B1519}
  :root[data-accent="brown"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#1A120C;--paper-2:#261B13;--hair:#3A2C21;--bar:#0F0A06;--art-bg:#352517;--pop:#F2BD7E;--soft:#261B13}

  :root[data-accent="rose"]:not([data-theme="light"]){--ink:#EDE3D1;--rule:#EDE3D1;--paper:#2A1820;--paper-2:#38212B;--hair:#4A2E3A;--bar:#1A0E14;--art-bg:#4A2433;--pop:#FFB8CC;--soft:#38212B}}
:root[data-theme="dark"][data-accent="ink"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#111111;--paper-2:#1D1B18;--hair:#2E2B26;--bar:#000;--art-bg:#26231F;--pop:#FF6B4F;--soft:#26231F}

:root[data-theme="dark"][data-accent="olive"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#12150B;--paper-2:#1C2013;--hair:#2E3322;--bar:#0A0C06;--art-bg:#2A301A;--pop:#D2E27E;--soft:#1C2013}
:root[data-theme="dark"][data-accent="rose"]{--ink:#EDE3D1;--rule:#EDE3D1;--paper:#2A1820;--paper-2:#38212B;--hair:#4A2E3A;--bar:#1A0E14;--art-bg:#4A2433;--pop:#FFB8CC;--soft:#38212B}
:root[data-size="s"]{--fs:14.5px}:root[data-size="l"]{--fs:18px}:root[data-space="airy"]{--sp:1.4}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--head);font-size:var(--fs);line-height:1.5;padding-block:0 96px;padding-inline:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.ar{font-family:var(--ar);direction:rtl;text-align:right;line-height:1.95}
.muted{color:var(--ink-2)}
.kick{font-size:.74em;font-weight:600;color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}
.strip{background:var(--bar);color:var(--bar-ink);font-size:.78em}
.strip .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.bar{background:var(--bar);color:var(--bar-ink);border-top:1px solid rgba(255,255,255,.08);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar .wrap{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;min-height:58px}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;color:var(--bar-ink)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--bar-ink);min-height:44px;min-width:0}
.brand .wm{font-family:var(--display);font-weight:800;font-size:1.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{width:30px;height:30px;flex:none}
.ticker{background:var(--paper-2);border-bottom:1px solid var(--hair);overflow:hidden}
.track{display:flex;gap:10px;padding:10px 0;width:max-content;animation:tick 55s linear infinite}
.ticker:hover .track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tcard{background:var(--bar);color:var(--bar-ink);border-radius:6px;padding:7px 12px;min-width:150px;display:flex;flex-direction:column;gap:1px}
.tcard .l{font-size:.74em;font-weight:600;opacity:.85;white-space:nowrap}
.tcard .v{font-size:.98em;font-weight:700;white-space:nowrap}
.dir-up{color:#5FD39A}.dir-down{color:#FF7B70}.dir-flat{opacity:.75}
.tabs{border-bottom:1px solid var(--hair)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px 9px;font-weight:600;font-size:.92em;color:var(--ink-2);cursor:pointer;min-height:44px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:calc(36px*var(--sp))}
.sh h2{margin:0;font-weight:900;font-size:1.65em;letter-spacing:-.01em;line-height:1.1}
.more{background:none;border:0;color:var(--ink-2);font-weight:600;font-size:.85em;cursor:pointer;min-height:44px}
.shr{position:relative;height:3px;background:var(--hair);margin:10px 0 calc(16px*var(--sp))}
.shr::before{content:"";position:absolute;left:0;top:0;height:3px;width:var(--w,96px);background:var(--ink)}
.shr::after{content:"";position:absolute;left:calc(var(--w,96px) + 6px);top:0;height:3px;width:14px;background:var(--pop)}
@media (prefers-reduced-motion:no-preference){.shr::before{animation:sweep .9s ease both}@keyframes sweep{from{width:24px}}}
.band{background:var(--bar);color:var(--bar-ink);margin-top:calc(36px*var(--sp));margin-inline:-16px}
.band .in{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.band h2{margin:0;font-weight:900;font-size:1.5em}
.band .more{color:var(--bar-ink)}
.mast{text-align:center;padding-top:calc(18px*var(--sp))}
.mast .the{font-family:var(--display);font-style:italic;font-size:1.05em}
.mast h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,62px);letter-spacing:.06em;line-height:1}
.mast .tag{display:flex;align-items:center;gap:12px;margin-top:8px}
.mast .tag span{flex:1;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);height:3px;opacity:.5}
.mast .tag i{font-family:var(--display);font-size:.95em}
.art{display:block;width:100%;height:auto;background:var(--art-bg)}
.art .bg{fill:var(--art-bg)}.art .fg{fill:var(--art-fg)}.art .pop{fill:var(--pop)}.art .ln{stroke:var(--art-fg);fill:none}.art .lp{stroke:var(--pop);fill:none}
.art .t{fill:var(--art-fg);font-family:var(--display);font-weight:800}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .a-rot{animation:rot 60s linear infinite}.a-rot-r{animation:rot 90s linear infinite reverse}
  .a-pulse{animation:pulse 3.2s ease-in-out infinite}
  .a-flow{stroke-dasharray:8 6;animation:flow 2.4s linear infinite}
  .a-draw{stroke-dasharray:900;animation:draw 6s ease-in-out infinite alternate}
  .a-bob{animation:bob 4s ease-in-out infinite}
  .a-scan{animation:scan 9s ease-in-out infinite alternate}
  .a-wave{animation:wave 3.6s ease-out infinite}
  .a-blink{animation:blink 2.6s ease-in-out infinite}
  .a-grow{transform-origin:bottom;transform-box:fill-box;animation:grow 5s ease-in-out infinite alternate}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.8}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(var(--scan,180px))}}
@keyframes wave{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.lead{display:flex;flex-direction:column;gap:10px;margin-top:calc(22px*var(--sp));cursor:pointer;text-decoration:none}
.credit{font-size:.7em;color:var(--ink-2);text-align:right;margin-top:-4px}
.lead h3{margin:0;font-weight:900;font-size:clamp(1.7em,5.8vw,2.6em);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.lead:hover h3{text-decoration:underline;text-decoration-thickness:2px}
.cta{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;font-weight:700;cursor:pointer;align-self:flex-start;text-decoration:none}
.cta[disabled]{opacity:.6;cursor:wait}
.status{display:inline-flex;align-items:center;font-size:.72em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.status.read{background:var(--ink);color:var(--paper)}
.status.missed{color:var(--miss)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hl{display:flex;flex-direction:column}
.hl button{display:block;text-align:left;background:none;border:0;border-top:1px solid var(--hair);padding:14px 0;font-weight:800;font-size:1.05em;line-height:1.25;cursor:pointer}
.hl button:hover{text-decoration:underline}
.hl button:first-child{border-top:0}
.hl small{display:block;font-weight:600;font-size:.72em;color:var(--ink-2);margin-bottom:3px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.story{flex:none;width:158px;scroll-snap-align:start;background:none;border:0;padding:0;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:8px}
.story .frame{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:9/15;background:var(--art-bg);display:block}
.story .frame .art{height:100%;transition:transform .5s ease}
.story:hover .frame .art{transform:scale(1.05)}
.story .ov{position:absolute;inset:auto 0 0 0;padding:10px;background:var(--art-bg);color:var(--art-fg);font-family:var(--ar);font-size:.82em;line-height:1.6;direction:rtl;font-weight:700}
.story .badge{position:absolute;top:8px;left:8px;background:var(--pop);color:var(--art-bg);font-size:.64em;font-weight:800;padding:3px 7px;border-radius:3px;letter-spacing:.05em}
.story .cap2{font-weight:800;font-size:.86em;line-height:1.3;text-align:left}
.dcard{flex:none;width:250px;scroll-snap-align:start;border-left:1px solid var(--hair);padding:2px 14px;display:flex;flex-direction:column;gap:6px;text-decoration:none}
.dcard:first-child{border-left:0;padding-left:0}
.dcard .when{font-size:.74em;color:var(--ink-2)}
.dcard .amt{font-family:var(--display);font-weight:800;font-size:2em;line-height:1}
.dcard .tt{font-weight:800;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.7em;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--soft)}
.chip.pop{background:var(--ink);color:var(--paper)}
.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:48px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:14px 0;border-top:1px dotted var(--ink-2);text-decoration:none}
.rk:first-child{border-top:0}
.rk .n{font-weight:900;font-size:3em;line-height:.8;opacity:.16}
.rk .h{font-weight:800;line-height:1.3;display:block}
.rk .s{font-size:.75em;color:var(--ink-2);display:block;margin-bottom:3px}
.rk .barbox{height:62px;display:flex;align-items:flex-end;background:var(--art-bg);border-radius:4px;padding:24px 6px 6px;position:relative;overflow:hidden}
.rk .barbox i{display:block;width:100%;background:var(--pop);border-radius:2px}
.rk .barbox b{position:absolute;top:5px;left:7px;color:var(--art-fg);font-size:.74em}
@media (prefers-reduced-motion:no-preference){.rk .barbox i{animation:rise 1.1s ease both}@keyframes rise{from{transform:scaleY(.3);transform-origin:bottom}}}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0}
.card .c{font-size:.74em;font-weight:600;color:var(--ink-2)}
.card .h{font-weight:800;line-height:1.25;padding-bottom:12px;border-bottom:1px dotted var(--ink-2)}
.card:hover .h{text-decoration:underline}
.viz{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.vizbox h4{margin:0 0 6px;font-weight:800}
.src{font-size:.72em;color:var(--ink-2);margin-top:8px}
@media (min-width:860px){.front-top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:32px;align-items:start}.viz{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sect-h{font-weight:900;font-size:clamp(2.4em,10vw,3.6em);letter-spacing:-.03em;line-height:1;margin:calc(22px*var(--sp)) 0 0}
.sub{display:flex;overflow-x:auto;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-top:14px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;background:none;border:0;padding:12px;font-size:1em;cursor:pointer;min-height:44px;border-bottom:3px solid transparent}
.sub button.parent{font-weight:800}
.sub .div{width:1px;background:var(--hair);margin:10px 4px;flex:none}
.sub button[aria-current="true"]{border-bottom-color:var(--ink);font-weight:800}
.back{background:none;border:0;color:var(--ink-2);font-weight:600;cursor:pointer;min-height:44px;padding:0;margin-top:12px}
.art-h{margin:6px 0 4px;font-weight:900;font-size:clamp(1.9em,6.5vw,3em);line-height:1.04;letter-spacing:-.02em;text-wrap:balance}

<script>
const SECTIONS=[
  {key:'desk',name:'My Desk',subs:[['today','Today'],['saved','Saved'],['foryou','For you'],['following','Following'],['stats','Stats'],['plan','The Plan'],['lexicon','Lexicon'],['archive','Archive']]},
  {key:'markets',name:'Markets',track:'market',subs:[['saudi','Saudi'],['uae','UAE'],['egypt','Egypt'],['gcc','GCC'],['funds','Funds'],['ipos','IPOs'],['regulation','Regulation']]},
  {key:'venture',name:'Venture',track:'fundamentals',subs:[['funds','Funds'],['stages','Stages'],['valuation','Valuation'],['terms','Term Sheets'],['cvc','CVC'],['exits','Exits']]},
  {key:'analyst',name:'The Analyst',track:'evaluation',subs:[['decks','Pitch Decks'],['team','Team'],['market-size','Market Size'],['unit','Unit Economics'],['dd','Due Diligence'],['memos','Memos']]},
  {key:'industries',name:'Industries',track:'sectors',subs:[['fintech','Fintech'],['ai','AI'],['cyber','Cybersecurity'],['telecom','Telecom'],['logistics','Logistics'],['other','Other']]},
  {key:'deals',name:'Deals',subs:[['early','Pre-seed & Seed'],['seriesa','Series A'],['late','Series B+'],['debt','Debt'],['charts','Charts']]},
  {key:'watchlist',name:'Watchlist',subs:[]},
  {key:'investors',name:'Investors',subs:[]},
  {key:'opinion',name:'Opinion',track:'open',subs:[['weekly','Weekly Close'],['debates','Debates'],['trends','Trends']]}
];
const TRACK_SEC={market:'markets',fundamentals:'venture',evaluation:'analyst',sectors:'industries',open:'opinion'};
const TRACK_NAME={market:'Markets',fundamentals:'Venture',evaluation:'The Analyst',sectors:'Industries',open:'Opinion'};
const DAY={fundamentals:'Sunday',evaluation:'Monday',market:'Tuesday',sectors:'Wednesday',open:'Thursday'};
const LEVELS={1:'Foundations',2:'Deeper',3:'Advanced'};
const S={rounds:[],stories:[],news:[],terms:[],certs:[],saved:[],follows:[],watch:[],plan:null,state:null,market:null,ready:false,view:{name:'front'},drafts:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
const D=s=>new Date((s||'')+'T12:00:00');
const fmtShort=s=>D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtLong=s=>D(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const isRead=r=>r.status==='read'||r.status==='madeup';
const realRounds=()=>S.rounds.filter(r=>!r.preview);
const money=m=>m==null?'Undisclosed':m>=1000?'$'+(m/1000).toFixed(2).replace(/\.?0+$/,'')+'B':m>=1?'$'+(+m.toFixed(1))+'M':'$'+Math.round(m*1000)+'K';
const amt=n=>n.amountLabel||money(n.amount);
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80);
function ago(s){const d=Math.round((Date.now()-D(s).getTime())/864e5);if(d<=0)return 'Today';if(d===1)return 'Yesterday';if(d<7)return d+' days ago';return fmtShort(s)}
const secName=k=>(SECTIONS.find(s=>s.key===k)||{name:''}).name;
const docSec=d=>d.section||TRACK_SEC[d.track]||'markets';

/* ===== typographic covers ===== */
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function shortWord(t){const w=String(t||'').replace(/[:,.'’]/g,'').split(/\s+/).filter(x=>x.length>2&&!/^(the|and|for|how|why|what|with|from|into|its|are)$/i.test(x));return (w.slice(0,2).join(' ')||'Round').toUpperCase()}
function cover(d,w,h,kick){
  const t=String(d.coverText||(d.kind==='deal'?amt(d):shortWord(d.topic||d.title)));const sub=d.coverSub||(d.kind==='deal'?[d.stage,d.sector,d.country].filter(Boolean).join(' · '):'');
  const lay=hash(t+(d.id||''))%3;const len=Math.max(t.length,3);
  const fs=Math.min(h*(lay===2?.34:.5),(w*.86)/(len*.7));const pad=w*.06;
  let g=`<rect class="bg" width="${w}" height="${h}"/>`;
  for(let i=1;i<6;i++)g+=`<line class="ln" x1="0" y1="${(h*i/6).toFixed(1)}" x2="${w}" y2="${(h*i/6).toFixed(1)}" stroke-width=".6" opacity=".08"/>`;
  const k=esc((kick||'').toUpperCase());const kfs=Math.max(8,Math.min(h*.06,15,(w*.8)/(Math.max(k.length,4)*.72)));
  if(lay===0){g+=`<rect class="pop" x="${pad}" y="${(h*.12).toFixed(1)}" width="${(w*.1).toFixed(1)}" height="4"/><text class="cv-k" x="${pad}" y="${(h*.12+kfs+10).toFixed(1)}" font-size="${kfs}">${k}</text><text class="cv-t cv-in" x="${pad}" y="${(h*.8).toFixed(1)}" font-size="${fs.toFixed(1)}">${esc(t)}</text><text class="cv-s" x="${pad}" y="${(h*.8+kfs*1.6).toFixed(1)}" font-size="${kfs}">${esc(sub)}</text>`}
  else if(lay===1){g+=`<text class="cv-k" x="${w/2}" y="${(h*.2).toFixed(1)}" font-size="${kfs}" text-anchor="middle">${k}</text><text class="cv-t cv-in" x="${w/2}" y="${(h*.58).toFixed(1)}" font-size="${fs.toFixed(1)}" text-anchor="middle">${esc(t)}</text><rect class="pop cv-bar" x="${(w/2-w*.12).toFixed(1)}" y="${(h*.66).toFixed(1)}" width="${(w*.24).toFixed(1)}" height="6"/><text class="cv-s" x="${w/2}" y="${(h*.66+kfs*2.4).toFixed(1)}" font-size="${kfs}" text-anchor="middle">${esc(sub)}</text>`}
  else{const words=t.split(' ');const lfs=Math.min(h*.3,(w*.86)/(Math.max(...words.map(x=>x.length),3)*.72));g+=`<text class="cv-k" x="${pad}" y="${(h*.16).toFixed(1)}" font-size="${kfs}">${k}</text>`+words.slice(0,3).map((x,i)=>`<text class="cv-t cv-in ${i===words.length-1&&words.length>1?'cv-pop':''}" style="animation-delay:${i*.15}s" x="${pad}" y="${(h*.2+lfs*(i+1)*.95).toFixed(1)}" font-size="${lfs.toFixed(1)}">${esc(x)}</text>`).join('')+(w>300?`<circle class="pop a-pulse fb" cx="${(w-pad-8).toFixed(1)}" cy="${(h*.14).toFixed(1)}" r="6"/><text class="cv-s" x="${pad}" y="${(h*.92).toFixed(1)}" font-size="${kfs}">${esc(sub)}</text>`:'')}
  return `<svg class="art" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g}</svg>`;
}

/* ===== settings, drafts ===== */
const DEF={size:'m',space:'comfy',theme:'auto',accent:'navy'};let SET={...DEF};

/* ===== streak ===== */
function computeStreak(){const s=realRounds().filter(r=>r.type!=='weekend').sort((a,b)=>a.no-b.no);let n=0;for(let i=s.length-1;i>=0;i--){const r=s[i];if(isRead(r))n++;else if(r.status==='pending'&&i===s.length-1)continue;else break}return n}
function flameSVG(n,base){if(!n)return '';const sz=Math.round(base*(n>=20?1.6:n>=10?1.35:n>=5?1.15:1));return `<svg class="flame" width="${sz}" height="${sz}" viewBox="0 0 32 40" role="img" aria-label="${n}-day streak"><path class="fo" d="M16 2c1.6 6.2 9.8 10.4 9.8 20.2C25.8 32 21.4 38 16 38S6.2 32.6 6.2 24.6c0-5.6 3.4-8.6 5.2-12 .6 3 1.8 5 3.6 6C15.6 13 14.4 7.6 16 2z"/><path class="fi" d="M16.4 17c.8 3.4 5 5.6 5 10.8 0 4.6-2.4 7.4-5.4 7.4s-5.4-2.6-5.4-6.6c0-2.8 1.6-4.4 2.6-6 .4 1.6 1 2.6 2 3.2.4-3-.2-5.6 1.2-8.8z"/></svg>`}

const sh=(title,more,to)=>`<div class="sh"><h2>${esc(title)}</h2>${more?`<button class="more" data-more="${esc(to)}">${esc(more)} ›</button>`:''}</div><div class="shr" style="--w:${Math.min(200,40+title.length*11)}px"></div>`;
function openDoc(col,id){const d=(col==='rounds'?S.rounds:S.stories).find(x=>x.id===id);if(d)go({name:'article',col,id,from:docSec(d)})}
function bindCommon(root){
  root.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.preventDefault();const [k,sub]=b.dataset.more.split('/');go({name:'section',key:k,sub:sub||null})});
  root.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.preventDefault();const [c,i]=b.dataset.open.split('|');openDoc(c,i)});
  root.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>{const u=b.dataset.url;if(u&&u!=='#'){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click()}});
  root.querySelectorAll('[data-follow]').forEach(b=>b.onclick=e=>{e.stopPropagation();e.preventDefault();const [k,n]=b.dataset.follow.split('|');toggleFollow(k,n)});
  root.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();e.preventDefault();const [c,i,t]=b.dataset.save.split('|');toggleSave(c,i,t)});
}
const todayRound=()=>realRounds().sort((a,b)=>b.no-a.no)[0];
function planTrack(t){return S.plan&&(S.plan.tracks||[]).find(x=>x.key===t)}
function nextTopic(t){const pt=planTrack(t);const st=((S.state||{}).tracks||{})[t]||{level:1,next:0};const lv=pt&&(pt.levels||[]).find(l=>l.level===st.level);return lv&&lv.topics?lv.topics[st.next]:null}
const newsSorted=()=>[...S.news].sort((a,b)=>String(b.date).localeCompare(String(a.date))||((b.amount||0)-(a.amount||0)));
const storiesSorted=()=>[...S.stories].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
function dealCard(n){return `<a class="dcard" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener"><span class="when">${esc(ago(n.date))} · ${esc(n.source||'')}</span>${n.kind==='deal'?`<span class="amt tnum">${esc(amt(n))}</span>`:''}<span class="tt">${esc(n.title)}</span><span class="chips">${n.stage?`<span class="chip pop">${esc(n.stage)}</span>`:''}${n.sector?`<span class="chip">${esc(n.sector)}</span>`:''}${n.country?`<span class="chip">${esc(n.country)}</span>`:''}${n.lens?'<span class="chip lensc">Tali Lens</span>':''}</span></a>`}

/* ===== charts ===== */
function hexMap(){const m=S.market;if(!m)return '';const C=[['EGY',60,78],['KSA',140,78],['KWT',140,28],['BHR',184,53],['QAT',228,78],['UAE',272,103],['OMN',228,128]];const by={};(m.countries||[]).forEach(c=>by[c.code]=c);const max=Math.max(...(m.countries||[]).map(c=>c.amount||0),1);
  const hx=(cx,cy,s)=>{const p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p.push((cx+s*Math.cos(a)).toFixed(1)+','+(cy+s*Math.sin(a)).toFixed(1))}return p.join(' ')};const mm=v=>v>=1000?money(v):'$'+Math.round(v)+'M';
  return `<svg viewBox="0 0 330 160" width="100%" role="img" aria-label="Venture funding by country, ${esc(m.period)}">`+C.map(([k,x,y])=>{const c=by[k];const hot=c&&c.amount===max;const fg=hot?'var(--paper)':'var(--ink)';return `<polygon points="${hx(x,y,27)}" style="fill:${hot?'var(--ink)':c?'var(--soft)':'var(--paper-2)'};stroke:var(--paper);stroke-width:3"/><text x="${x}" y="${y-5}" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1" style="fill:${fg};opacity:.75;font-family:var(--head)">${k}</text><text x="${x}" y="${y+10}" text-anchor="middle" font-size="11.5" font-weight="800" style="fill:${fg};font-family:var(--head)">${c?mm(c.amount):'—'}</text>${c?`<text x="${x}" y="${y+21}" text-anchor="middle" font-size="7.5" style="fill:${fg};opacity:.75;font-family:var(--head)">${c.deals} deals</text>`:''}`}).join('')+`</svg>`}
function treemap(){const m=S.market;if(!m||!(m.sectors||[]).length)return '';const items=[...m.sectors];if(m.other)items.push({name:'Other',amount:m.other.amount,approx:true});const tot=items.reduce((s,x)=>s+x.amount,0)||1;
  const W=330,H=160,big=items[0],bw=Math.max(120,Math.min(W-160,W*big.amount/tot*.8));
  let out=`<rect x="0" y="0" width="${bw}" height="${H}" style="fill:var(--ink)"/><text x="12" y="36" font-size="28" font-weight="900" style="fill:var(--paper);font-family:var(--head)">${Math.round(big.amount/tot*100)}%</text><text x="12" y="54" font-size="10" font-weight="700" letter-spacing="1.5" style="fill:var(--paper);opacity:.8;font-family:var(--head)">${esc(big.name.toUpperCase())}</text><text x="12" y="${H-12}" font-size="11" style="fill:var(--paper);font-family:var(--head)">${money(big.amount)}</text>`;
  const rest=items.slice(1),gap=2,avail=H-gap*(rest.length-1),minH=38;const rt=rest.reduce((s,i)=>s+i.amount,0)||1;let hs=rest.map(it=>Math.max(minH,avail*it.amount/rt));const sc=avail/hs.reduce((a,b)=>a+b,0);hs=hs.map(x=>x*sc);let y=0;
  rest.forEach((it,i)=>{out+=`<rect x="${bw+gap}" y="${y.toFixed(1)}" width="${W-bw-gap}" height="${hs[i].toFixed(1)}" style="fill:var(--ink);opacity:${(.78-i*.16).toFixed(2)}"/><text x="${bw+10}" y="${(y+18).toFixed(1)}" font-size="10" font-weight="800" style="fill:var(--paper);font-family:var(--head)">${esc(it.name)}</text><text x="${bw+10}" y="${(y+31).toFixed(1)}" font-size="10" style="fill:var(--paper);opacity:.85;font-family:var(--head)">${it.approx?'≈':''}${money(it.amount)}</text>`;y+=hs[i]+gap});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Venture funding by sector">${out}</svg>`}
const moneyMap=()=>S.market?`<div class="viz"><div class="vizbox"><h4>Where the deals were · ${esc(S.market.period)}</h4>${hexMap()}</div><div class="vizbox"><h4>Where the money went · ${esc(S.market.period)}</h4>${treemap()}</div></div><div class="src">Source: <a href="${esc(safeUrl(S.market.url))}" target="_blank" rel="noopener">${esc(S.market.source)}</a></div>`:'';
function rankList(list,full){const mx=Math.max(1,...list.map(n=>n.amount||0));return `<div class="rank">${list.map((n,i)=>`<div class="rk"><span class="n">${i+1}</span><span><span class="s">${esc(ago(n.date))} · ${esc(n.sector||'')} · ${esc(n.country||'')} · ${esc(n.stage||'')}</span><a class="h" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.title)}</a>${full&&n.investors?`<span class="s" style="margin-top:4px">Investors: ${esc(n.investors)}</span>`:''}${full&&n.lens?`<span class="lensbox ar"><b>Tali Lens</b> ${esc(n.lens)}</span>`:''}</span><span class="barbox"><b class="tnum">${esc(amt(n))}</b><i style="height:${n.amount?Math.max(8,Math.round(Math.sqrt(n.amount/mx)*100)):6}%"></i></span></div>`).join('')}</div>`}

    <aside>${sh('Latest','All','deals')}<div class="hl">${news.slice(0,6).map(n=>`<button data-url="${esc(safeUrl(n.url))}"><small>${esc(ago(n.date))} · ${esc(n.country||'')}${n.kind==='deal'&&n.amount?' · '+esc(amt(n)):''}</small>${esc(n.title)}</button>`).join('')||'<span class="muted">No news yet.</span>'}</div></aside></div>

/* ===== SECTION ===== */
function stageGroup(n){const s=(n.stage||'').toLowerCase();if(s.includes('debt'))return 'debt';if(s.includes('pre-series a')||s==='series a')return 'seriesa';if(/series [b-z]|growth|pre-series [b-z]/.test(s))return 'late';if(s.includes('seed'))return 'early';return 'other'}
function renderSection(){
  const sec=SECTIONS.find(s=>s.key===S.view.key)||SECTIONS[1];const sub=S.view.sub;const el=$('#view');
  const subName=sub&&(sec.subs.find(s=>s[0]===sub)||[])[1];
  const subnav=sec.subs.length?`<div class="sub">${sub?`<button class="parent" data-sub="">${esc(sec.name)}</button><span class="div"></span>`:''}${sec.subs.map(([k,n])=>`<button data-sub="${k}" ${sub===k?'aria-current="true"':''}>${esc(n)}</button>`).join('')}</div>`:'';
  const topicName=subName&&sec.key!=='desk'?subName:sec.name;
  const canFollow=!['desk','watchlist','investors','deals'].includes(sec.key);
  let body='';
  if(sec.key==='desk')body=renderDesk(sub||'today');
  else if(sec.key==='watchlist')body=renderWatch();
  else if(sec.key==='investors')body=renderInvestors();
  else if(sec.key==='deals'){
    if(sub==='charts')body=moneyMap()||'<div class="empty"><b>No charts yet</b></div>';
    else{const list=newsSorted().filter(n=>n.kind==='deal'&&(!sub||stageGroup(n)===sub));
      body=(sub?'':sh('The Money Map')+moneyMap())+sh(sub?subName:'All deals')+(list.length?rankList(list,true):'<div class="empty"><b>No deals here yet</b></div>');
      const other=newsSorted().filter(n=>n.kind!=='deal');if(!sub&&other.length)body+=sh('Also moving')+`<div class="hl">${other.map(n=>`<button data-url="${esc(safeUrl(n.url))}"><small>${esc(ago(n.date))} · ${esc(n.source||'')}</small>${esc(n.title)}</button>`).join('')}</div>`}
  }else{
    const st=storiesSorted().filter(d=>docSec(d)===sec.key&&(!sub||d.sub===sub));
    const rs=realRounds().filter(r=>docSec(r)===sec.key&&(!sub||r.sub===sub)).sort((a,b)=>b.no-a.no);
    const all=[...rs.map(d=>({col:'rounds',d})),...st.map(d=>({col:'stories',d}))].sort((x,y)=>String(y.d.date).localeCompare(String(x.d.date)));
    const lead=all[0];const nt=sec.track&&nextTopic(sec.track);
    if(lead){const t=lead.d.title||(lead.d.article||{}).title;body+=`<a class="lead" href="#" data-open="${lead.col}|${esc(lead.d.id)}">${cover(lead.d,800,450,lead.col==='rounds'?'Round '+lead.d.no:sec.name)}<span class="kick">${lead.col==='rounds'?'Round '+esc(lead.d.no):esc(ago(lead.d.date))} · ${esc(lead.d.source||(lead.d.article||{}).source||'')}</span><h3>${esc(t)}</h3>${lead.d.summaryAr?`<p class="ar" style="margin:0">${esc(lead.d.summaryAr)}</p>`:''}</a>`}
    if(all.length>1)body+=`<div class="hl" style="margin-top:14px">${all.slice(1,8).map(x=>`<button data-open="${x.col}|${esc(x.d.id)}"><small>${x.col==='rounds'?'Round '+esc(x.d.no)+' · ':''}${esc(ago(x.d.date))}</small>${esc(x.d.title||(x.d.article||{}).title)}</button>`).join('')}</div>`;
    const rel=newsSorted().filter(n=>(n.sections||[]).includes(sec.key)&&(!sub||(n.tags||[]).includes(sub)));
    if(rel.length)body+=sh('Latest in '+topicName)+`<div class="rail">${rel.slice(0,10).map(dealCard).join('')}</div>`;
    if(sec.key==='markets'&&!sub&&S.market)body+=sh('The Money Map')+moneyMap();

function bindDesk(r,col){
  const key=col+'-'+r.id;const dr=S.drafts[key]=S.drafts[key]||{};
  document.querySelectorAll('#view textarea[data-f]').forEach(t=>{t.value=dr[t.dataset.f]||'';t.oninput=()=>{dr[t.dataset.f]=t.value;saveDrafts();['chatErr','deskErr','paraErr'].forEach(i=>{const e=$('#'+i);if(e)e.hidden=true})}});
  $('#askFab').hidden=!SAMPLE;
  if(!SAMPLE){$('#chatIn').hidden=true;$('#paraIn').hidden=true;const e=$('#chatErr');e.hidden=false;e.textContent='النقاش والشرح يشتغلون لما تفتح الموقع من تطبيق Claude.'}
  const db=$('#doneBtn');if(db)db.onclick=async()=>{const err=$('#deskErr'),st=$('#deskStatus');const notes=(dr.notes||'').trim(),answer=(dr.answer||'').trim();
    if(!DB){err.hidden=false;err.textContent='ما أقدر أحفظ هنا. افتح الموقع من تطبيق Claude.';return}
    db.disabled=true;st.textContent='يحفظ…';
    try{await DB.doc(col+'/'+r.id).update({status:'read',notes,answer,completedAt:new Date().toISOString()});
      if(col==='rounds'&&!r.advanced){for(const g of(r.glossary||[])){const sl=slug(g.term);if(!sl)continue;const ref=DB.doc('terms/'+sl),snap=await ref.get();if(snap.exists)await ref.update({count:((snap.data().count)||1)+1});else await ref.set({term:g.term,ar:g.ar||'',explain:g.explain||'',firstRound:r.no,count:1})}
        if(['fundamentals','evaluation','market','sectors'].includes(r.track)&&S.state){const cur=(S.state.tracks||{})[r.track]||{level:1,next:0};const lv=((planTrack(r.track)||{}).levels||[]);let level=cur.level,next=(cur.next||0)+1;const len=((lv.find(l=>l.level===level)||{}).topics||[]).length;const nl=lv.find(l=>l.level===level+1);
          if(len&&next===len)await DB.doc('certificates/'+r.track+'-L'+level).set({track:r.track,level,levelName:LEVELS[level]||'',completedAt:new Date().toISOString(),roundNo:r.no,topics:len});
          if(next>=len&&nl&&(nl.topics||[]).length){level++;next=0}await DB.doc('meta/state').update({tracks:{[r.track]:{level,next}}})}
        await DB.doc('rounds/'+r.id).update({advanced:true})}
      delete S.drafts[key];saveDrafts();
      if((notes||answer)&&SAMPLE){SAMPLE.json(`You are the editor of The Morning Round, Meshal's personal daily reading paper on venture capital, CVC and startups. ${READER}\n\n${ctxOf(r,col)}\n\nHIS NOTES:\n${notes||'(none)'}\n\nHIS ANSWER TO THE QUESTION:\n${answer||'(none)'}\n\nWrite your editor's note on his understanding in 3 to 6 short lines of Gulf Arabic: what he got right, what is missing or wrong and the correction, and one concrete link to his work at a CVC. Be warm but honest. Reply with only JSON: {"feedback": "..."}`).then(res=>{const fb=String((res&&res.feedback)||'').trim();if(fb)return DB.doc(col+'/'+r.id).update({feedback:fb})}).catch(()=>{})}
    }catch(e){db.disabled=false;st.textContent='';err.hidden=false;err.textContent='ما انحفظت، جرب مرة ثانية.'}};
  const pb=$('#paraBtn');if(pb&&SAMPLE)pb.onclick=async()=>{const err=$('#paraErr'),out=$('#paraOut');const p=(dr.para||'').trim();if(!p){err.hidden=false;err.textContent='ألصق الفقرة أول.';return}
    pb.disabled=true;out.innerHTML='<div class="letter reply"><div class="ar" id="paraLive">المحرر يقرأ الفقرة…</div><div class="sig">— The Editor</div></div>';
    try{const {text}=await SAMPLE(`You are the editor of The Morning Round. ${READER}\n\n${ctxOf(r,col)}\n\nHe pasted this paragraph from the article and did not understand it:\n"""${p.slice(0,4000)}"""\n\nExplain it in Gulf Arabic: first what it says in plain terms, then any number or term in it and what it means, then how it fits the article's argument. Keep technical terms in English. Be concise.`,{onText:({text})=>{const l=$('#paraLive');if(l)l.textContent=text}});dr.para='';saveDrafts();await addChat(r,col,'اشرح لي هالفقرة: '+p.slice(0,600),text)}
    catch(e){out.innerHTML='';err.hidden=false;err.textContent=errText(e)}finally{pb.disabled=false}};
  const sb=$('#sendBtn');if(sb&&SAMPLE)sb.onclick=async()=>{const err=$('#chatErr'),log=$('#chatLog');const msg=(dr.chat||'').trim();if(!msg){err.hidden=false;err.textContent='اكتب سؤالك أول.';return}
    const hist=(r.chat||[]).slice(-16);if(!(r.chat||[]).length)log.innerHTML='';
    log.insertAdjacentHTML('beforeend',`<div class="letter"><div class="ar">${esc(msg)}</div><div class="sig">— M. Alkanhal</div></div><div class="letter reply"><div class="ar" id="live">المحرر يكتب…</div><div class="sig">— The Editor</div></div>`);sb.disabled=true;
    const rules=`You are the editor of The Morning Round, Meshal's personal daily reading paper on venture capital, CVC and startups, discussing this piece with him. ${READER}\n\n${ctxOf(r,col)}\n${r.notes?'\nHis notes: '+r.notes:''}\n\nAnswer clearly and concisely. Use the editor's file for what the article says; if he asks about a passage it does not cover, say so and ask him to paste it in the paragraph box. Never invent quotes or numbers from the article. Connect ideas to his work at a CVC when it helps.`;
    try{const {text}=await SAMPLE([{role:'user',content:rules},...hist.map(m=>({role:m.role==='user'?'user':'assistant',content:m.content})),{role:'user',content:msg}],{cache:false,onText:({text})=>{const l=$('#live');if(l)l.textContent=text}});dr.chat='';saveDrafts();await addChat(r,col,msg,text)}
    catch(e){const l=$('#live');if(l)l.textContent=e&&e.text?e.text:'';err.hidden=false;err.textContent=errText(e);sb.disabled=false}};
}
$('#askFab').onclick=()=>{const t=$('#chatBox');if(!t)return;t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});setTimeout(()=>t.focus({preventScroll:true}),350)};

/* ===== LAB ===== */
function labHTML(L){
  const head=`<div class="labx"><span class="lbl" style="color:var(--pop)">Apply it · illustrative numbers</span><h4>${esc(L.title||'')}</h4>${L.intro?`<p class="ar" style="margin:0">${esc(L.intro)}</p>`:''}`;
  if(L.type==='crowdin')return head+`<label for="li1">Public anchor commitment (SAR M)<span class="tnum" id="lv1"></span><input id="li1" type="range" min="25" max="1000" step="25" value="200"></label><label for="li2">Private SAR raised per public SAR<span class="tnum" id="lv2"></span><input id="li2" type="range" min="1" max="6" step=".5" value="3"></label>
    <div><span class="lbl" style="color:var(--art-fg)">Total capital reaching startups</span><div class="out tnum" id="lo"></div></div><div class="stack"><i id="ls1" style="background:var(--pop)"></i><i id="ls2" style="background:var(--art-fg)"></i></div><div class="legend"><span style="--c:var(--pop)">Public anchor</span><span style="--c:var(--art-fg)">Private capital crowded in</span></div><p class="ar note" style="margin:0" id="lt"></p></div>`;
  if(L.type==='captable')return head+`<label for="li1">Seed: % sold<span id="lv1"></span><input id="li1" type="range" min="5" max="35" value="15"></label><label for="li2">Series A: % sold<span id="lv2"></span><input id="li2" type="range" min="5" max="40" value="20"></label><label for="li3">Series B: % sold<span id="lv3"></span><input id="li3" type="range" min="0" max="35" value="15"></label><label for="li4">Option pool<span id="lv4"></span><input id="li4" type="range" min="0" max="20" value="10"></label>
    <div><span class="lbl" style="color:var(--art-fg)">Founders after Series B</span><div class="out tnum" id="lo"></div></div><div class="stack" id="lstack"></div><div class="legend" id="lleg"></div></div>`;
  if(L.type==='unit')return head+`<label for="li1">CAC (SAR)<span id="lv1"></span><input id="li1" type="range" min="50" max="2000" step="25" value="300"></label><label for="li2">Monthly revenue per customer (SAR)<span id="lv2"></span><input id="li2" type="range" min="10" max="500" step="5" value="60"></label><label for="li3">Gross margin<span id="lv3"></span><input id="li3" type="range" min="10" max="90" value="60"></label><label for="li4">Monthly churn<span id="lv4"></span><input id="li4" type="range" min="1" max="15" step=".5" value="4"></label>
    <div class="grid3"><div class="kpi"><b class="tnum" id="k1"></b><span>LTV</span></div><div class="kpi"><b class="tnum" id="k2"></b><span>LTV / CAC</span></div><div class="kpi"><b class="tnum" id="k3"></b><span>Payback (months)</span></div></div><p class="ar note" style="margin:0" id="lt"></p></div>`;
  return head+`<table><thead><tr><th>Investor</th><th>Chance %</th><th>Check $M</th><th>EV</th></tr></thead><tbody id="evb">${(L.rows||[['Fund A',60,2],['Fund B',25,8],['Angel C',80,.5],['CVC D',35,5]]).map(([n,p,m],i)=>`<tr><td>${esc(n)}</td><td><input type="number" min="0" max="100" value="${p}" data-k="p" aria-label="${esc(n)} chance"></td><td><input type="number" min="0" step=".5" value="${m}" data-k="m" aria-label="${esc(n)} check"></td><td class="tnum" data-ev="${i}"></td></tr>`).join('')}</tbody></table><p class="ar note" style="margin:0" id="lt"></p></div>`;
}
function bindLab(L,r,col){const g=id=>document.getElementById(id);
  const box=document.querySelector('.labx');if(box){const st=(r&&r.labState)||{};box.querySelectorAll('input').forEach((inp,i)=>{const k=inp.id||('n'+i);if(st[k]!=null)inp.value=st[k]});let tm;box.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{const o={};box.querySelectorAll('input').forEach((inp,i)=>o[inp.id||('n'+i)]=inp.value);if(DB&&r)DB.doc(col+'/'+r.id).update({labState:o}).catch(()=>{})},700)})}
  if(L.type==='crowdin'){const u=()=>{const a=+g('li1').value,m=+g('li2').value,priv=a*m,tot=a+priv;g('lv1').textContent=a;g('lv2').textContent=m.toFixed(1)+'×';g('lo').textContent='SAR '+(tot>=1000?(tot/1000).toFixed(2)+'B':tot+'M');g('ls1').style.width=(a/tot*100)+'%';g('ls2').style.width=(priv/tot*100)+'%';g('lt').textContent=`كل ريال حكومي هنا يجيب معه ${m.toFixed(1)} ريال من القطاع الخاص، يعني ${Math.round(priv/tot*100)}٪ من الفلوس اللي توصل الشركات الناشئة خاصة.`};['li1','li2'].forEach(i=>g(i).oninput=u);u()}
  else if(L.type==='captable'){const u=()=>{const s=+g('li1').value/100,a=+g('li2').value/100,b=+g('li3').value/100,p=+g('li4').value/100;['lv1','lv2','lv3','lv4'].forEach((k,i)=>g(k).textContent=Math.round([s,a,b,p][i]*100)+'%');let F=1-s-p;const k1=1-a,k2=1-b;const f=F*k1*k2,sd=s*k1*k2,pl=p*k1*k2,A=a*k2,B=b;const parts=[['Founders',f,'var(--pop)'],['Seed',sd,'var(--art-fg)'],['Series A',A,'rgba(237,227,209,.6)'],['Series B',B,'rgba(237,227,209,.35)'],['Option pool',pl,'rgba(237,227,209,.18)']];g('lo').textContent=(f*100).toFixed(1)+'%';g('lstack').innerHTML=parts.map(x=>`<i style="width:${x[1]*100}%;background:${x[2]}"></i>`).join('');g('lleg').innerHTML=parts.map(x=>`<span style="--c:${x[2]}">${x[0]} ${(x[1]*100).toFixed(1)}%</span>`).join('')};['li1','li2','li3','li4'].forEach(i=>g(i).oninput=u);u()}
  else if(L.type==='unit'){const u=()=>{const c=+g('li1').value,r=+g('li2').value,m=+g('li3').value/100,ch=+g('li4').value/100;g('lv1').textContent=c;g('lv2').textContent=r;g('lv3').textContent=Math.round(m*100)+'%';g('lv4').textContent=(ch*100).toFixed(1)+'%';const ltv=r*m/ch,ratio=ltv/c,pb=c/(r*m);g('k1').textContent='SAR '+Math.round(ltv);g('k2').textContent=ratio.toFixed(1)+'×';g('k3').textContent=pb.toFixed(1);g('lt').textContent=ratio>=3?'نسبة LTV/CAC فوق 3×، وهذا اللي يحبه أغلب المستثمرين.':'النسبة تحت 3×، يعني الشركة تصرف كثير على جلب العميل مقارنة باللي يرجع منه.'};['li1','li2','li3','li4'].forEach(i=>g(i).oninput=u);u()}
  else{const tb=g('evb');const u=()=>{const rows=[...tb.querySelectorAll('tr')].map((tr,i)=>{const p=+tr.querySelector('[data-k=p]').value||0,m=+tr.querySelector('[data-k=m]').value||0;return{i,ev:p/100*m,n:tr.cells[0].textContent}});rows.forEach(x=>tb.querySelector(`[data-ev="${x.i}"]`).textContent='$'+x.ev.toFixed(2)+'M');g('lt').textContent='رتبهم كذا: '+[...rows].sort((a,b)=>b.ev-a.ev).map(x=>x.n).join('، ')};tb.oninput=u;u()}
}

function render(){renderChrome();renderTabs();$('#askFab').hidden=true;const v=S.view.name;if(v==='front')renderFront();else if(v==='section')renderSection();else renderArticle()}
applySettings();render();

(async()=>{
  const db=await(window.claude&&window.claude.use?window.claude.use('db'):null);DB=db;
  if(window.claude&&window.claude.use)window.claude.use('sample').then(s=>{SAMPLE=s;if(S.view.name==='article')render()}).catch(()=>{});
  if(!db){S.ready=true;$('#view').innerHTML='<div class="empty"><b>The paper can\'t load here</b><span class="muted">Open The Morning Round from your Claude app to see your rounds.</span></div>';return}
  let t=null;const soon=()=>{clearTimeout(t);t=setTimeout(()=>{const a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')){renderChrome();return}const y=window.scrollY;render();window.scrollTo(0,y)},80)};
  const err=()=>{};const col=(name,key)=>db.collection(name).onSnapshot(s=>{S[key]=s.docs.map(x=>({id:x.id,...x.data()}));if(key==='rounds')S.ready=true;soon()},err);
  col('rounds','rounds');col('stories','stories');col('news','news');col('terms','terms');col('certificates','certs');col('saved','saved');col('follows','follows');col('watchlist','watch');
  db.doc('meta/plan').onSnapshot(s=>{S.plan=s.exists?s.data():null;soon()},err);
  db.doc('meta/state').onSnapshot(s=>{S.state=s.exists?s.data():null;soon()},err);
  db.doc('meta/market').onSnapshot(s=>{S.market=s.exists?s.data():null;soon()},err);
})();
</script>
